<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Учёт баллонов ПГС — сканер</title>
<style>
  :root { --blue:#1a4d8f; --bg:#f5f6f8; --border:#d9dce1; --ok:#1e7e34; --warn:#b26a00; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif; margin:0; background:var(--bg); color:#222; }
  header { background:var(--blue); color:#fff; padding:14px 16px; }
  header h1 { font-size:18px; margin:0; }
  header p { margin:4px 0 0; font-size:12px; opacity:.85; }
  main { max-width:640px; margin:0 auto; padding:16px; }
  .card { background:#fff; border:1px solid var(--border); border-radius:8px; padding:16px; margin-bottom:16px; }
  .card h2 { font-size:15px; margin:0 0 12px; color:var(--blue); }
  button { font-size:15px; padding:12px 16px; border-radius:6px; border:none; cursor:pointer; }
  .primary { background:var(--blue); color:#fff; width:100%; }
  .secondary { background:#eef1f5; color:#333; width:100%; margin-top:8px; }
  .ok { background:var(--ok); color:#fff; width:100%; margin-top:8px; }
  label { display:block; font-size:13px; color:#555; margin:10px 0 4px; }
  input, select { width:100%; padding:10px; font-size:15px; border:1px solid var(--border); border-radius:6px; }
  .row { display:flex; gap:8px; } .row > div { flex:1; }
  #preview { width:100%; border-radius:6px; display:none; margin-top:12px; }
  #status { font-size:13px; margin-top:10px; padding:8px; border-radius:6px; display:none; }
  .st-ok { background:#e6f4ea; color:var(--ok); }
  .st-warn { background:#fdf1e0; color:var(--warn); }
  .st-err { background:#fdecea; color:#b3261e; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { border:1px solid var(--border); padding:6px 8px; text-align:left; }
  th { background:#eef1f5; }
  .hidden { display:none; }
</style>
</head>
<body>
<header>
  <h1>Учёт баллонов ПГС</h1>
  <p>Сфотографируйте этикетку — номер, паспорт и концентрация заполнятся сами</p>
</header>
<main>

<section class="card">
  <h2>Шаг 1. Этикетка</h2>
  <button class="primary" id="btnCam">📷 Сфотографировать этикетку</button>
  <input type="file" id="fileInput" accept="image/*" capture="environment" class="hidden">
  <img id="preview" alt="">
  <div id="status"></div>
  <button class="secondary hidden" id="btnOcr" style="margin-top:10px">🔍 Распознать текст</button>
</section>

<section class="card hidden" id="formCard">
  <h2>Шаг 2. Операция</h2>
  <div class="row">
    <div><label>№ баллона</label><input id="ballonNo"></div>
    <div><label>№ паспорта</label><input id="passportNo"></div>
  </div>
  <div class="row">
    <div><label>Объём, дм³</label><input id="volume" inputmode="decimal"></div>
    <div><label>Давление, МПа</label><input id="pressure" inputmode="decimal"></div>
  </div>
  <div class="row">
    <div><label>Газ</label>
      <select id="gas">
        <option>Метан (CH4)</option>
        <option>Оксид углерода (CO)</option>
        <option>Воздух</option>
        <option>Азот (N2)</option>
      </select>
    </div>
    <div><label>Концентрация, % об.д.</label><input id="conc" inputmode="decimal"></div>
  </div>
  <div class="row">
    <div><label>НКПР (авто)</label><input id="lkpr" readonly></div>
    <div><label>CO, ppm (авто)</label><input id="coPpm" readonly></div>
  </div>
  <label>Тип операции</label>
  <select id="opType">
    <option>Приём из Югра-ПГС (заправленный)</option>
    <option>Отправка в Югра-ПГС (пустой)</option>
    <option>Выдача клиенту</option>
    <option>Выдача в Газ-Лаб</option>
    <option>Возврат от клиента</option>
  </select>
  <label id="whoLabel">Клиент / сотрудник</label>
  <input id="who" placeholder="Фамилия или организация">
  <label>Дата</label>
  <input id="date" type="date">
  <button class="ok" id="btnSave">✅ Внести запись</button>
</section>

<section class="card">
  <h2>Журнал этой смены</h2>
  <div id="logBox"><p style="font-size:13px;color:#777">Записей пока нет.</p></div>
  <button class="secondary" id="btnExport">📋 Скопировать журнал текстом</button>
</section>

</main>
<script>
const CONFIG = {
  API_KEY: "",        // API-ключ Yandex Vision — вставьте сюда
  FOLDER_ID: "",      // Folder ID Yandex Cloud
  WEBHOOK_URL: ""     // адрес вебхука (Google Apps Script / свой сервер), необязательно
};

const $ = id => document.getElementById(id);
let currentImage = null;

function status(msg, cls){ const s=$('status'); s.style.display='block'; s.className=cls; s.textContent=msg; }

$('btnCam').onclick = () => $('fileInput').click();
$('fileInput').onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ev => { currentImage = ev.target.result; $('preview').src=currentImage; $('preview').style.display='block'; $('btnOcr').classList.remove('hidden'); status('Фото готово. Нажмите «Распознать».', 'st-ok'); };
  r.readAsDataURL(f);
};

$('btnOcr').onclick = () => {
  if(!CONFIG.API_KEY){ status('OCR-ключ не задан. Заполните поля вручную по этикетке — форма ниже уже открыта.', 'st-warn'); showForm(); return; }
  const b64 = currentImage.split(',')[1];
  const body = { analyze_specs:{ content:b64, features:[{type:'TEXT', text_detection_config:{text_types:['PRINTED']}}] } };
  fetch('https://ocr.api.cloud.yandex.net/ocr/v1/annotate', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', Authorization:'Api-Key '+CONFIG.API_KEY, 'x-folder-id':CONFIG.FOLDER_ID },
    body: JSON.stringify(body)
  })
  .then(r => r.json())
  .then(d => {
    const txt = JSON.stringify(d);
    const res = parseLabel(txt);
    fillForm(res);
  })
  .catch(e => status('Ошибка OCR: '+e.message+'. Заполните вручную.', 'st-err'));
};

function grab(s, re){ const m = s.match(re); return m ? m[1] : ''; }

function parseLabel(s){
  const out = {};
  out.ballon = grab(s, /Баллон[^0-9]{0,30}(\d{4,6})/i) || grab(s, /(\d{4,6})\s*\|\s*4/i) || grab(s, /(\d{4,6})/);
  out.passport = grab(s, /(\d{4,6}-\d{2})/);
  out.conc = grab(s, /(?:CH4|метан|метан)[^0-9]{0,40}(\d{1,2}[.,]\d{1,3})/i);
  out.volume = grab(s, /(\d{1,2})\s*дм/i);
  out.pressure = grab(s, /(\d{1,2}[.,]\d)\s*МПа/i);
  return out;
}

function fillForm(r){
  if(r.ballon) $('ballonNo').value = r.ballon;
  if(r.passport) $('passportNo').value = r.passport;
  if(r.volume) $('volume').value = r.volume;
  if(r.pressure) $('pressure').value = r.pressure.replace(',', '.');
  if(r.conc){ $('conc').value = r.conc.replace(',', '.'); recalc(); }
  showForm();
  status('Распознано. Сверьте цифры с этикеткой и поправьте при необходимости.', 'st-warn');
}

function showForm(){ $('formCard').classList.remove('hidden'); const t=new Date(); $('date').value = t.toISOString().slice(0,10); recalc(); }

function recalc(){
  const g = $('gas').value, c = parseFloat($('conc').value.replace(',','.'));
  if(isNaN(c)){ $('lkpr').value=''; $('coPpm').value=''; return; }
  if(g.startsWith('Метан')) $('lkpr').value = (c/4.4*100).toFixed(1);
  else if(g.includes('CO')) { $('lkpr').value = (c/12.5*100).toFixed(1); $('coPpm').value = Math.round(c*10000); }
  else { $('lkpr').value='—'; $('coPpm').value='—'; }
}
$('gas').onchange = recalc; $('conc').oninput = recalc;

const SENSITIVE = ['выдача клиенту','выдача в Газ-Лаб'];
$('opType').onchange = () => $('whoLabel').textContent = SENSITIVE.includes($('opType').value) ? 'Клиент / сотрудник' : 'Кто принимает / передал';

function rec(e){ try{ JSON.parse(e); }catch(err){ return; } let logs = JSON.parse(localStorage.getItem('pgs_log')||'[]'); return logs; }

$('btnSave').onclick = () => {
  const rec = {
    date: $('date').value,
    ballon: $('ballonNo').value.trim(),
    passport: $('passportNo').value.trim(),
    gas: $('gas').value,
    conc: $('conc').value,
    lkpr: $('lkpr').value,
    op: $('opType').value,
    who: $('who').value.trim()
  };
  if(!rec.ballon){ status('Не указан № баллона.', 'st-err'); return; }
  let logs = JSON.parse(localStorage.getItem('pgs_log')||'[]');
  logs.push(rec);
  localStorage.setItem('pgs_log', JSON.stringify(logs));
  renderLog();
  if(CONFIG.WEBHOOK_URL){
    fetch(CONFIG.WEBHOOK_URL, { method:'POST', body: JSON.stringify(rec) }).catch(()=>{});
  }
  status('Запись внесена.', 'st-ok');
};

function renderLog(){
  const logs = JSON.parse(localStorage.getItem('pgs_log')||'[]');
  if(!logs.length) return;
  let h = '<table><tr><th>Дата</th><th>№ баллона</th><th>Паспорт</th><th>Операция</th><th>% об.</th><th>НКПР</th><th>Кто</th></tr>';
  logs.slice().reverse().forEach(r => {
    h += '<tr><td>'+r.date+'</td><td>'+r.ballon+'</td><td>'+r.passport+'</td><td>'+r.op+'</td><td>'+r.conc+'</td><td>'+r.lkpr+'</td><td>'+r.who+'</td></tr>';
  });
  $('logBox').innerHTML = h + '</table>';
}
renderLog();

$('btnExport').onclick = () => {
  const logs = JSON.parse(localStorage.getItem('pgs_log')||'[]');
  if(!logs.length){ status('Журнал пуст.', 'st-warn'); return; }
  const lines = logs.map(r => [r.date,r.ballon,r.passport,r.gas,r.conc,r.lkpr,r.op,r.who].join(';')).join('\n');
  navigator.clipboard.writeText(lines).then(()=>status('Журнал скопирован. Вставьте в Excel (Ctrl+V).','st-ok')).catch(()=>status('Не удалось скопировать.','st-err'));
};
</script>
</body>
</html>
