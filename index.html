<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { overscroll-behavior:none; }
  body {
    font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
    background:#0e1117; color:#e8eaf0; min-height:100vh;
    padding:14px; padding-bottom:86px; max-width:560px; margin:0 auto;
  }
  .screen { display:none; }
  .screen.active { display:block; animation:fade .25s ease; }
  @keyframes fade { from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
  h1 { font-size:1.3rem; line-height:1.3; margin-bottom:10px; }
  h2 { font-size:1.05rem; margin:14px 0 10px; }
  .sub { color:#9aa3b2; font-size:.93rem; line-height:1.5; margin-bottom:16px; }
  input {
    width:100%; padding:14px; font-size:1rem; color:#e8eaf0;
    background:#171c26; border:2px solid #262d3a; border-radius:12px; margin-bottom:10px;
  }
  input:focus { outline:none; border-color:#3d7bff; }
  .btn {
    width:100%; padding:15px; font-size:1.02rem; font-weight:600;
    background:linear-gradient(135deg,#3d7bff,#7b4dff);
    color:#fff; border:none; border-radius:12px; cursor:pointer;
    touch-action:manipulation; user-select:none; -webkit-user-select:none;
    transition:transform .12s ease, opacity .12s ease;
  }
  .btn2 {
    background:#171c26; border:1px solid #262d3a; color:#c6cdd8; font-weight:500;
    padding:13px; font-size:.95rem;
  }
  .btn:active { transform:scale(.97); }
  .btn:disabled { opacity:.4; cursor:default; transform:none; }
  .row { display:flex; gap:10px; margin-top:10px; }
  .row .btn { flex:1; }
  .topbar { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .topbar h2 { margin:0; flex:1; }
  .xbtn {
    background:#171c26; border:1px solid #262d3a; color:#f87171;
    border-radius:10px; padding:9px 14px; font-size:.9rem; cursor:pointer;
    touch-action:manipulation; user-select:none;
  }
  .tiles { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
  .tile {
    background:#171c26; border:1px solid #262d3a; border-radius:14px;
    padding:16px 12px; cursor:pointer; touch-action:manipulation; user-select:none;
  }
  .tile .ic { font-size:1.6rem; margin-bottom:6px; }
  .tile .tt { font-weight:600; font-size:.95rem; }
  .tile .ds { color:#9aa3b2; font-size:.8rem; margin-top:3px; line-height:1.35; }
  .card { background:#171c26; border:1px solid #262d3a; border-radius:14px; padding:14px 16px; margin-bottom:12px; }
  .card.locked { opacity:.55; }
  .card .wt { font-weight:600; margin-bottom:6px; }
  .card .wd { color:#9aa3b2; font-size:.88rem; line-height:1.45; }
  .tag { display:inline-block; font-size:.75rem; font-weight:700; padding:3px 9px; border-radius:20px; margin-right:6px; }
  .tag.ok { background:#1d3a24; color:#4ade80; }
  .tag.warn { background:#3a2d1d; color:#fbbf24; }
  .tag.done { background:#1d2a4a; color:#60a5fa; }
  .bar { height:8px; background:#262d3a; border-radius:4px; overflow:hidden; margin:8px 0; }
  .bar i { display:block; height:100%; width:0%; background:linear-gradient(90deg,#3d7bff,#7b4dff); transition:width .3s ease; }
  .qtext { font-size:1.08rem; line-height:1.45; margin-bottom:16px; font-weight:500; }
  .opt {
    display:flex; align-items:center; min-height:62px;
    background:#171c26; border:2px solid #262d3a; border-radius:12px;
    padding:14px 16px; margin-bottom:12px; cursor:pointer;
    font-size:.98rem; line-height:1.4;
    touch-action:manipulation; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
    transition:border-color .15s ease, background .15s ease;
  }
  .opt .mark { margin-left:auto; font-weight:700; opacity:0; padding-left:10px; }
  .opt.sel .mark { opacity:1; color:#3d7bff; }
  .opt.sel { border-color:#3d7bff; background:#1a2337; }
  .theory div { background:#171c26; border:1px solid #262d3a; border-radius:12px; padding:12px 14px; margin-bottom:10px; font-size:.95rem; line-height:1.5; }
  .theory b { color:#7fa8ff; }
  .fl {
    background:#171c26; border:1px solid #262d3a; border-radius:14px;
    padding:16px; margin-bottom:12px; cursor:pointer; touch-action:manipulation; user-select:none;
  }
  .fl .fn { font-weight:600; font-size:1rem; }
  .fl .fb { display:none; margin-top:10px; font-size:.9rem; color:#c6cdd8; line-height:1.5; }
  .fl.open .fb { display:block; }
  .fl .fa { margin-left:8px; color:#9aa3b2; font-size:.85rem; }
  table { width:100%; border-collapse:collapse; font-size:.85rem; margin:8px 0; }
  td, th { padding:7px 8px; border-bottom:1px solid #262d3a; text-align:left; }
  th { color:#9aa3b2; font-weight:600; }
  .swatch { display:inline-block; width:14px; height:14px; border-radius:4px; vertical-align:middle; border:1px solid #000; }
  .num { font-size:2.2rem; font-weight:700; text-align:center; margin:10px 0 2px; }
  .cap { text-align:center; color:#9aa3b2; margin-bottom:14px; }
  .dots { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:16px; }
  .dot { width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.85rem; font-weight:600; }
  .dot.ok { background:#1d3a24; color:#4ade80; }
  .dot.bad { background:#3a1d1d; color:#f87171; }
  .qnum { font-size:.85rem; color:#9aa3b2; }
  .nav { position:fixed; bottom:0; left:0; right:0; background:#121722; border-top:1px solid #262d3a; display:flex; z-index:50; }
  .nav div { flex:1; text-align:center; padding:9px 2px 11px; font-size:.72rem; color:#9aa3b2; cursor:pointer; touch-action:manipulation; user-select:none; }
  .nav div .ni { font-size:1.25rem; display:block; margin-bottom:2px; }
  .nav div.on { color:#7fa8ff; }
  .bdg { display:inline-block; background:#171c26; border:1px solid #262d3a; border-radius:12px; padding:10px 8px; width:calc(33% - 8px); text-align:center; font-size:.72rem; margin-bottom:8px; vertical-align:top; }
  .bdg .bi { font-size:1.5rem; display:block; margin-bottom:4px; }
  .bdg.no { opacity:.35; filter:grayscale(1); }
  .bdg.yes { border-color:#3d7bff; }
  .lbrow { display:flex; align-items:center; gap:10px; background:#171c26; border:1px solid #262d3a; border-radius:12px; padding:12px 14px; margin-bottom:8px; }
  .lbrow .pos { font-weight:700; width:28px; color:#9aa3b2; }
  .lbrow .nm { flex:1; }
  .lbrow .nm small { color:#9aa3b2; display:block; font-size:.75rem; }
  .lbrow .xp { font-weight:700; color:#7fa8ff; }
  code.f { background:#0e1117; border:1px solid #262d3a; border-radius:8px; padding:8px 12px; display:block; margin:8px 0; font-size:.95rem; color:#7fa8ff; }
  .ver { text-align:center; color:#5b6472; font-size:.78rem; margin-top:18px; }
  .resbox { background:#171c26; border:1px dashed #3d7bff; border-radius:12px; padding:12px; font-size:.95rem; text-align:center; margin:10px 0; user-select:all; -webkit-user-select:text; }
  .hidden { display:none; }
  .gold { color:#fbbf24; }
</style>

try { if (window.WebApp && typeof window.WebApp.ready === 'function') WebApp.ready(); } catch(e) {}

var WEEKS = [
{t:'Напряжение, ток, сопротивление',
 th:['<b>Электрический ток</b> — это движение заряженных частиц (электронов) по проводнику. Как вода в трубе, только вместо воды — электроны.',
     '<b>Напряжение U</b> измеряется в вольтах (В) — это «давление», которое толкает электроны. Батарейка АА — 1,5 В, аккумулятор телефона — 3,7 В, розетка — 220 В.',
     '<b>Ток I</b> измеряется в амперах (А) — это «сколько» электронов течёт. Тысяча миллиампер (мА) = 1 ампер.',
     '<b>Сопротивление R</b> измеряется в омах (Ω) — это «тормоз» для тока. Узкий шланг пропускает меньше воды — так же и резистор.',
     'Прибор для измерения всего этого — <b>мультиметр</b>. Главный закон всей электроники мы выучим на следующей неделе.',
     '<b>Модель воды</b>: напряжение — давление насоса, ток — поток воды, сопротивление — узость трубы. Закрыл кран (большое R) — течёт тонко (малый I).',
     'Сам ток ты не увидишь — увидишь его результат: свет LED, тепло паяльника, звук динамика. Электроника — наука о невидимом.',
     '<b>Проводники</b> пропускают ток: медь, алюминий, железо, вода (обычная), тело человека. <b>Изоляторы</b> не пропускают: резина, пластик, стекло, сухое дерево.',
     'Провода покрывают изоляцией не для красоты: без неё провода замыкаются друг на друга, а касание пальцем — уже удар током.',
     'В тонком проводе ток течёт так же легко, как в толстом — но толстый греется меньше, как широкая труба меньше «душит» поток.',
     'Кружочки на батарейке «+» и «−» — это полюса. Ток в цепи идёт от «+» к «−», если не разрывать цепь.',
     'Словарик недели: <b>цепь</b> — путь для тока, <b>плюс/минус</b> — полюса питания, <b>контакты</b> — места соединения проводов.',
     '<b>Практика недели</b>: посмотри на любую батарейку и найди «+» (обычно выпуклый бок). Это первое умение электронщика — не перепутать полюса.'],
 qs:[{q:'Что толкает электроны по проводу?',opts:['Напряжение','Сопротивление','Цвет провода'],a:0,why:'Напряжение — это «давление». Без него электроны стоят на месте, как вода в закрытом кране.'},
     {q:'В чём измеряется сила тока?',opts:['В вольтах','В амперах','В омах'],a:1,why:'Ток — амперы (А), напряжение — вольты (В), сопротивление — омы (Ω). Три кита электроники.'},
     {q:'Какое напряжение у батарейки АА?',opts:['220 В','9 В','1,5 В'],a:2,why:'1,5 вольта. «Крона» — 9 В, аккумулятор телефона — 3,7 В, розетка — 220 В.'},
     {q:'Сопротивление измеряется в…',opts:['омах','амперах','фаза́х'],a:0,why:'Ом (Ω). 1000 ом = 1 килоом (кОм), 1 000 000 ом = 1 МОм.'},
     {q:'Что из этого проводник?',opts:['Пластик','Медь','Резина'],a:1,why:'Медь — отличный проводник. Пластик и резина — изоляторы, ими покрывают провода.'}]},

{t:'Закон Ома и мощность',
 th:['<b>Закон Ома</b> — главная формула электроники: <b>I = U / R</b>. Ток равен напряжению, делённому на сопротивление.',
     'Из неё следуют ещё две: <b>U = I × R</b> и <b>R = U / I</b>. Знаешь две величины — найдёшь третью.',
     '<b>Пример:</b> батарейка 3 В и резистор 100 Ом: I = 3 / 100 = 0,03 А = 30 мА.',
     '<b>Мощность P = U × I</b>, измеряется в ваттах (Вт). Чайник на 220 В потребляет около 8 А — это почти 1800 Вт.',
     'Больше напряжения → больше ток. Больше сопротивления → меньше ток. Это правило стоит выучить наизусть.',
     'Есть удобный <b>треугольник Ома</b>: вверху U, внизу I и R. Закрой пальцем то, что ищешь, — и увидишь формулу.',
     'Георг Ом открыл свой закон в 1826 году — почти 200 лет назад, а он всё ещё самый нужный. Его имя носит единица сопротивления.',
     '<b>Мощность резистора</b> тоже важна: маленький резистор 0,25 Вт при большом токе нагреется и почернеет. Для учебных схем хватает 0,25 Вт.',
     '<b>Киловатт-час</b> — то, за что платят в счёт electricity: 1 кВт × 1 час работы. Чайник «съедает» 1 кВт·ч за полчаса.',
     'Проверка себя: если схема «не работает», первым делом считают ток по Ому. Почти всегда ответ лежит в этой формуле.',
     'Словарик: <b>ватт</b> — единица мощности, <b>кВт</b> — тысяча ватт, <b>предохранитель</b> — деталь, которая сгорает первой и спасает схему.',
     '<b>Практика недели</b>: посчитай ток LED от кроны 9 В через 470 Ом: 9 / 470 ≈ 19 мА. Вот почему резистор обязателен!'],
 qs:[{q:'Закон Ома: I = ?',opts:['U × R','U / R','R / U'],a:1,why:'I = U/R. Чем больше сопротивление, тем меньше ток — прямая логика.'},
     {q:'Батарейка 6 В, резистор 200 Ом. Ток?',opts:['30 мА','1200 А','0,03 Ом'],a:0,why:'I = 6/200 = 0,03 А = 30 мА. Проверяй единицы: вольты делим на омы — получаем амперы.'},
     {q:'Как найти мощность?',opts:['P = U × I','P = U + I','P = U / I'],a:0,why:'P = U × I. Умножь напряжение на ток — получишь ватты.'},
     {q:'Чайник потребляет 8 А от 220 В. Мощность?',opts:['176 Вт','1760 Вт','28 Вт'],a:1,why:'220 × 8 = 1760 Вт ≈ 1,8 кВт. Поэтому чайник греет воду быстро.'},
     {q:'Увеличили сопротивление при том же напряжении. Ток…',opts:['Вырос','Упал','Не изменился'],a:1,why:'I = U/R: R в знаменателе — растёт R, падает I.'}]},

{t:'Резисторы и цветовая маркировка',
 th:['<b>Резистор</b> — деталь, которая ограничивает ток. Без него светодиод сгорает за секунду.',
     'Номинал закодирован <b>цветными полосками</b>: 1-я и 2-я — цифры, 3-я — множитель (сколько нулей), 4-я — допуск.',
     '<b>Цифры:</b> чёрный 0, коричневый 1, красный 2, оранжевый 3, жёлтый 4, зелёный 5, синий 6, фиолетовый 7, серый 8, белый 9.',
     '<b>Золотая полоска</b> — допуск ±5%. Читают слева направо, золотой обычно справа.',
     '<b>Пример:</b> коричневый–чёрный–красный–золотой = 1, 0 и ×100 = 1000 Ом = <b>1 кОм ±5%</b>.',
     '<b>Мнемоника цветов</b>: «ЧеКа ПоЖеЗеСиФи СеБе» — Чёрный, Коричневый, Красный, Оранжевый, Жёлтый, Зелёный, Синий, Фиолетовый, Серый, Белый — цифры по первым буквам.',
     '<b>Допуск</b> — честность производителя: резистор «1 кОм ±5%» может быть от 950 до 1050 Ом. Для учебных схем это нормально.',
     'Резисторы бывают разной <b>мощности</b>: 0,125 Вт (мелкие), 0,25 Вт (стандарт), 1–5 Вт (крупные, для мощных цепей).',
     'Есть и <b>переменные резисторы</b> (потенциометры): крутишь ручку — меняется сопротивление. Громкость в колонке — это он.',
     'На схеме резистор рисуют <b>прямоугольником</b> (Европа) или <b>зигзагом</b> (Америка). Оба — правильно.',
     'Резистор не имеет полярности: можно втыкать любой стороной. Единственное, что важно, — номинал.',
     'Словарик: <b>номинал</b> — заявленное сопротивление, <b>ряд E24</b> — таблица стандартных номиналов (220, 330, 470…).',
     '<b>Практика недели</b>: возьми 3 резистора из набора и расшифруй их в «Считалке». Сверь с мультиметром, если он есть.'],
 qs:[{q:'Для чего нужен резистор?',opts:['Ограничивать ток','Усиливать сигнал','Хранить заряд'],a:0,why:'Резистор — ограничитель тока. Хранит заряд конденсатор, усиливает — транзистор.'},
     {q:'Чёрная полоска — это цифра…',opts:['0','9','5'],a:0,why:'Порядок: чёрный 0, коричневый 1, красный 2, оранжевый 3, жёлтый 4, зелёный 5, синий 6, фиолетовый 7, серый 8, белый 9.'},
     {q:'Коричневый–чёрный–красный–золотой — это…',opts:['10 Ом','1 кОм','100 Ом'],a:1,why:'1, 0, ×100 → 1000 Ом = 1 кОм ±5%. Потренируйся в «Считалке».'},
     {q:'Красная полоска — цифра…',opts:['2','3','4'],a:0,why:'Красный = 2, оранжевый = 3, жёлтый = 4.'},
     {q:'Золотая полоска означает…',opts:['Точность ±5%','Напряжение 5 В','Мощность 5 Вт'],a:0,why:'Золото — допуск ±5%, серебро — ±10%. Допуск показывает, насколько реально сопротивление может отличаться.'}]},

{t:'Последовательно и параллельно',
 th:['<b>Последовательно</b> (цепочкой): сопротивления складываются. R = R1 + R2. Два резистора по 100 Ом дадут 200 Ом.',
     '<b>Параллельно</b> (лесенкой): ток разделяется, общее сопротивление меньше меньшего. Формула: 1/R = 1/R1 + 1/R2.',
     '<b>Батарейки последовательно</b> складывают напряжение: две АА по 1,5 В = 3 В. Параллельно — напряжение то же, но ёмкость больше.',
     'В последовательной цепи ток везде одинаков. В параллельной — делится между ветвями.',
     'Ёлочная гирлянда старого типа — классика последовательного соединения: перегорела одна лампочка — погасла вся ветка.',
     '<b>Быстрое правило параллели</b>: два одинаковых резистора дают ровно половину. 100 + 100 параллельно = 50 Ом.',
     'Параллельные резисторы удобно считать через формулу «произведение на сумму»: R = R1 × R2 / (R1 + R2). Для 100 и 200: 100×200/300 ≈ 67 Ом.',
     'В <b>последовательной</b> цепи одно слабое звено ломает всё: где-то обрыв — ток не течёт нигде. Так устроены старые гирлянды.',
     'В <b>параллельной</b> цепи обрыв одной ветки не мешает другим: у дома лампочки в комнатах включаются независимо.',
     'Батарейки соединяют последовательно и в коробках пульта: 2 АА по 1,5 В = 3 В для двигателя машинки.',
     'Внимание: батарейки <b>разных типов</b> (садившаяся и свежая) в последовательной цепи — плохая идея: слабая начинает «отбирать» ток.',
     'Словарик: <b>ветвь</b> — отдельный путь тока, <b>узел</b> — точка, где сходятся провода.',
     '<b>Практика недели</b>: собери на макетке два резистора 100 Ом последовательно и измерь мультиметром: должно быть ~200 Ом. Потом параллельно — ~50 Ом.'],
 qs:[{q:'Два резистора по 100 Ом последовательно. Общее?',opts:['50 Ом','100 Ом','200 Ом'],a:2,why:'Последовательно складывается: 100 + 100 = 200 Ом.'},
     {q:'Два резистора по 100 Ом параллельно. Общее?',opts:['50 Ом','200 Ом','100 Ом'],a:0,why:'Параллельно: 1/R = 1/100 + 1/100 → R = 50 Ом. Правило: два одинаковых параллельно дают половину.'},
     {q:'Две батарейки АА последовательно дают…',opts:['3 В','1,5 В','0,75 В'],a:0,why:'Напряжение складывается: 1,5 + 1,5 = 3 В. Так устроены бокс с батарейками и powerbank.'},
     {q:'Что случится, если в старой гирлянде перегорит одна лампочка?',opts:['Погаснет вся ветка','Ничего','Остальные будут светить'],a:0,why:'Последовательная цепь разорвана — ток не течёт нигде. В новых гирляндах решают параллельными ветками.'},
     {q:'Параллельное соединение: ток в ветвях…',opts:['Одинаковый всюду','Делится между ветвями','Равен нулю'],a:1,why:'Ток разделяется пропорционально сопротивлениям ветвей, а напряжение на них одинаково.'}]},

{t:'Светодиоды и диоды',
 th:['<b>Диод</b> — электрический клапан: пропускает ток только в одну сторону.',
     '<b>Светодиод (LED)</b> — диод, который светится. У него две ноги: <b>анод (+, длинная)</b> и <b>катод (−, короткая, спил на корпусе)</b>.',
     'Светодиод подключают <b>всегда через резистор</b>: иначе ток превысит 20 мА, и LED умрёт.',
     'Разные цвета LED имеют разное падение напряжения: красный ≈ 1,8–2 В, синий и белый ≈ 3–3,2 В.',
     'Правило юного электронщика: сначала считаем резистор, потом подключаем светик.',
     'Если LED воткнуть <b>наоборот</b> — он просто не засветится: диод закрыт. Ничего не сгорит — такова природа клапана.',
     'Плоский спил на ободке корпуса LED всегда со стороны <b>катода</b> (минуса). Это второй ориентир, кроме длины ноги.',
     'Диоды бывают разные: <b>выпрямительные</b> (для блоков питания), <b>стабилитроны</b> (стабилизируют напряжение), <b>LED</b> (свет).',
     '<b>Диодный мост</b> из 4 диодов выпрямляет обе полуволны переменного тока — так из розетки получают постоянный ток для зарядки.',
     'LED устанавливают в цепочку: несколько последовательно — напряжение питания должно покрывать сумму их падений.',
     'Красный LED светится от 1,8 В — его можно зажечь даже от одной батарейки через правильный резистор (почти). Синему нужна минимум 3 В.',
     'Словарик: <b>анод</b> — плюс диода, <b>катод</b> — минус, <b>падение напряжения</b> — сколько вольт «съедает» диод.',
     '<b>Практика недели</b>: собери цепь крона 9 В → 470 Ом → красный LED. Потом поменяй полюса — LED молчит. Это и есть работа диода.'],
 qs:[{q:'Что делает диод?',opts:['Пропускает ток в одну сторону','Меняет ток на свет','Усиливает ток'],a:0,why:'Диод — односторонний клапан для тока. Светодиод — тот же клапан, который светится.'},
     {q:'Длинная нога светодиода — это…',opts:['Минус (катод)','Плюс (анод)','Без разницы'],a:1,why:'Длинная нога — анод, к плюсу. Короткая — катод, к минусу. У короткой ещё спил на ободке корпуса.'},
     {q:'Светодиод подключают без резистора. Что будет?',opts:['Сгорит от большого тока','Будет светить ярче','Ничего не изменится'],a:0,why:'Без ограничения ток может превысить 20 мА — LED перегреется и выйдет из строя. Всегда ставим резистор.'},
     {q:'Красному светодиоду нужно примерно…',opts:['1,8–2 В','12 В','220 В'],a:0,why:'Красный ~1,8–2 В, синий и белый ~3 В. Разница важна при расчёте резистора.'},
     {q:'Светодиод воткнули наоборот. Что произойдёт?',opts:['Не засветится','Взорвётся','Засветится ярче'],a:0,why:'Диод закрыт — ток не идёт. LED просто молчит, ничего не сгорит. Но резистор всё равно нужен.'}]},

{t:'Конденсаторы',
 th:['<b>Конденсатор</b> копит электрический заряд — как маленький бочонок-накопитель.',
     'Ёмкость измеряется в <b>фарадах</b>. На практике — микрофарады (мкФ) и пикофарады (пФ).',
     'Для постоянного тока конденсатор после заряда — разрыв цепи. Для переменного — проводник, и его поведение зависит от частоты. На этом строят фильтры.',
     '<b>Электролитические конденсаторы — полярные</b>: минус отмечен полоской. Перепутал — может «пукнуть».',
     'Конденсаторы ставят у питания, чтобы сглаживать рывки тока — как водонапорная башня сглаживает давление в трубах.',
     'Маркировка «104» на керамическом конденсаторе: 10 × 10⁴ пФ = 100 000 пФ = 100 нФ = 0,1 мкФ. Первые две цифры — число, третья — нули.',
     'Конденсаторы бывают <b>керамические</b> (маленькие, без полярности, для быстрых импульсов) и <b>электролитические</b> (бочонки, полярные, для больших ёмкостей).',
     'Заряженный конденсатор сохраняет заряд даже после отключения — будьте осторожны с большими ёмкостями в блоках питания.',
     'В схемах «моргалки» конденсатор заряжается через резистор и разряжается — получаются вспышки. Так работают мигающие гирлянды.',
     'Чем больше ёмкость, тем дольше заряжается: время заряда ≈ 5 × R × C. Это называется RC-цепочка.',
     'Конденсатор может дать <b>большой ток мгновенно</b>: вспышка фотика и вспышка камеры — это разряд конденсатора.',
     'Словарик: <b>фарада</b> — единица ёмкости, <b>мкФ</b> — миллионная фарады, <b>пФ</b> — триллионная.',
     '<b>Практика недели</b>: заряди большой электролит от батарейки и разряди на LED — увидишь короткую вспышку. Осторожно, не замыкай металлом!'],
 qs:[{q:'Что делает конденсатор?',opts:['Накапливает заряд','Усиливает ток','Светится'],a:0,why:'Конденсатор — накопитель заряда. Ёмкость в фарадах, на практике в мкФ и пФ.'},
     {q:'Ёмкость измеряется в…',opts:['фарадах','ваттах','герцах'],a:0,why:'Фарада (Ф). 1 мкФ — миллионная доля фарады, 1 пФ — триллионная.'},
     {q:'Что случится с конденсатором в цепи постоянного тока?',opts:['Зарядится, и ток прекратится','Ток потечёт бесконечно','Взорвётся'],a:0,why:'После заряда конденсатор для постоянного тока — разрыв. А переменный пропускает.'},
     {q:'Электролитический конденсатор — …',opts:['Полярный: путать нельзя','Без полярности','Всегда золотой'],a:0,why:'Полярный: минус отмечен полоской. Подключение наоборот может закончиться «пук»ом и запахом.'},
     {q:'Зачем конденсатор рядом с питанием?',opts:['Сглаживать рывки тока','Понизить сопротивление','Украсить плату'],a:0,why:'Он как маленький накопитель: отдаёт ток в пиках и забирает излишки — питание становится ровнее.'}]},

{t:'Макетная плата и пайка',
 th:['<b>Макетная плата (breadboard)</b> — собирать схемы без пайки: детали втыкаются в дырочки, внутри они уже соединены группами.',
     'Средние ряды соединены <b>вертикально</b> (по столбцам, с разрывом посередине под микросхемы), крайние шины (красный/синий) — <b>горизонтально</b>: это плюс и минус питания.',
     '<b>Пайка</b> — соединение деталей расплавленным оловом. Температура жала ~300 °C — это в 3 раза горячее кипятка. Не трогаем, не размахиваем паяльником.',
     'Паяем: чистое жало → касаемся детали и ноги одновременно → подаём олово → убираем олово → убираем паяльник. Занимает 2–3 секунды.',
     'Хорошая пайка — блестящая и гладкая, как капля. Матовая и серая — «холодная пайка», её переделывают.',
     '<b>Подготовка</b>: жало паяльника лудят — покрывают тонким слоем олова. Не лужёное жало плохо передаёт тепло.',
     '<b>Флюс</b> — вещество, которое помогает олову растекаться. В олове для пайки флюс уже внутри, но иногда нужна канифоль.',
     'Ноги деталей перед пайкой <b>зачищают</b>: окисленная поверхность не паяется. Наждачка или лезвие помогут.',
     'На макетке удобно <b>примерять</b> схему, а потом переносить её на настоящую плату пайкой — так делают все инженеры.',
     'Провода на макетке лучше специальные — с толстыми упругими концами. Обычные жилки быстро ломаются.',
     'Микросхемы втыкают в макетку <b>над разрывом</b> посередине: ноги слева и справа не должны соединяться.',
     'Словарик: <b>макетка</b> — плата без пайки, <b>лужение</b> — покрытие оловом, <b>флюс</b> — помощник пайки.',
     '<b>Практика недели</b>: собери на макетке простейшую цепь: батарейка → резистор → LED. Потом разбери и собери заново за 1 минуту — в этом сила макетки.'],
 qs:[{q:'Зачем нужна макетная плата?',opts:['Собирать схемы без пайки','Паять намертво','Хранить детали'],a:0,why:'Детали втыкаются в гнёзда и уже соединены внутри. Быстро собираем, разбираем, пересобираем.'},
     {q:'Крайние шины макетки (красная/синяя)…',opts:['Соединены горизонтально — это питание','Не соединены ни с чем','Соединены вертикально'],a:0,why:'Шины тянутся вдоль платы: красная — плюс, синяя — минус. Средние ряды соединяются поперёк.'},
     {q:'Температура жала паяльника около…',opts:['50 °C','300 °C','1000 °C'],a:1,why:'~300 °C — втрое горячее кипятка. Паяльник берём только за ручку и кладём на подставку.'},
     {q:'Хорошая пайка выглядит…',opts:['Блестящей и гладкой','Матовой и серой','Чёрной'],a:0,why:'Блеск = олово растеклось и соединение надёжное. Серая матовая — «холодная пайка», её греют заново.'},
     {q:'Порядок пайки:',opts:['Паяльник → олово → деталь','Паяльник к детали → подать олово → убрать олово → убрать паяльник','Олово → паяльник → всё'],a:1,why:'Сначала греем соединение, потом подаём олово, оно растекается — убираем олово, затем паяльник.'}]},

{t:'Транзисторы',
 th:['<b>Транзистор</b> — управляемый ключ и усилитель: маленьким током управляют большим.',
     'Три ноги: <b>база, коллектор, эмиттер</b>. Подал малый ток на базу — открыл «кран» между коллектором и эмиттером.',
     '<b>NPN-транзистор</b> (например, КТ315 или BC547) открывается, когда на базе плюс. Больше ток базы — сильнее открыт.',
     'Режимы: «закрыт» (выключатель), «открыт» (включатель), «усиление» (микрофон, усилитель звука).',
     'Транзистор — из тех изобретений, на которых стоит вся современная техника: в процессоре их миллиарды.',
     'Три режима можно сравнить с краном: закрыт — вода не идёт, приоткрыт — маленькая струя, открыт — полный поток.',
     '<b>PNP-транзистор</b> открывается наоборот: минусом на базе. NPN и PNP — как два зеркальных братца.',
     'На корпусе транзистора маркировка ноги: смотрят в даташите (справочник), иначе легко перепутать базу и эмиттер.',
     'Транзистор греется, если через него идёт большой ток — поэтому на мощные ставят <b>радиаторы</b> (металлические гребёнки).',
     '<b>MOSFET</b> — особый вид транзистора: управляется не током, а напряжением. Такие стоят в схемах управления моторами.',
     'Классическая схема: кнопка 3 В открывает транзистор, а тот включает мотор от 9 В. Кнопка — «командир», транзистор — «силач».',
     'Словарик: <b>база</b> — управление, <b>коллектор</b> — вход тока, <b>эмиттер</b> — выход тока.',
     '<b>Практика недели</b>: собери ключ на NPN: база через 1 кОм к кнопке → плюс 3 В. Коллектор к LED с резистором от 5 В. Кнопка щёлкает — LED горит.'],
 qs:[{q:'Сколько ног у транзистора?',opts:['2','3','4'],a:1,why:'Три: база, коллектор, эмиттер. Ноги разные — воткнул не той стороной, схема не заработает.'},
     {q:'Что делает транзистор?',opts:['Малым током управляет большим','Хранит заряд','Меняет цвет'],a:0,why:'Это ключ и усилитель: слабый сигнал на базе управляет мощным током через коллектор-эмиттер.'},
     {q:'Чтобы открыть NPN-транзистор, на базу подают…',opts:['Плюс','Минус','Ничего'],a:0,why:'NPN открывается плюсом на базе. PNP — наоборот, минусом.'},
     {q:'Где работают транзисторы?',opts:['Только в радиостанциях','Везде: от зарядки до процессора','Только в лампах'],a:1,why:'Транзисторы — кирпичики всей электроники. В процессоре их миллиарды.'},
     {q:'Режим транзистора «усиление» нужен, чтобы…',opts:['Сделать слабый сигнал сильным','Выключить схему','Понизить напряжение'],a:0,why:'Слабый сигнал (например, от микрофона) усиливается в разы — так работают усилители.'}]},

{t:'Переменный ток',
 th:['<b>Постоянный ток (DC)</b> течёт в одну сторону — батарейки, USB, солнечные панели.',
     '<b>Переменный ток (AC)</b> меняет направление 50 раз в секунду (50 Гц) — так устроена бытовая сеть.',
     'В розетке 220 В — это <b>действующее значение</b>. Пик синусоиды выше: около 311 В. Поэтому конденсаторы в блоках питания берут на 400 В.',
     '<b>Трансформатор</b> работает только на переменном токе — им повышают и понижают напряжение. Отсюда — ЛЭП на сотни тысяч вольт.',
     'Правило безопасности: розетку не разбираем и не трогаем. В 220 В сила уже «взрослая».',
     'Электричество в дом идёт по трём проводам: <b>фаза</b> (под напряжением), <b>ноль</b> (обратный путь), <b>земля</b> (защита).',
     '<b>Заземление</b> — путь для «убежавшего» тока: если прибор сломается, ток уйдёт в землю, а не через человека.',
     '<b>УЗО</b> (устройство защитного отключения) — страж в щитке: если ток утечёт, оно отключает питание за доли секунды.',
     'Частота 50 Гц — это полный цикл 20 мс. 100 раз в секунду напряжение проходит через ноль (плюс→ноль→минус→ноль).',
     'Электричество вырабатывается на станциях: вращают магнит в катушке — и получается синусоида. ГЭС, ТЭС и АЭС отличаются только тем, что вращает.',
     'Солнечные панели дают DC — их нельзя напрямую в розетку: нужен <b>инвертор</b>, который делает из DC переменный.',
     'Словарик: <b>фаза</b> — провод под напряжением, <b>ноль</b> — обратный провод, <b>Гц</b> — герцы, колебаний в секунду.',
     '<b>Практика недели</b> (только смотреть!): найди в электрощитке дома автоматические выключатели и УЗО. Спроси родителей, что они защищают.'],
 qs:[{q:'Что такое AC?',opts:['Переменный ток','Постоянный ток','Воздушный охладитель'],a:0,why:'AC — Alternating Current, переменный: направление меняется 50 раз в секунду.'},
     {q:'Частота бытовой сети в России — …',opts:['50 Гц','60 Гц','220 Гц'],a:0,why:'50 Гц и 220 В. В США — 60 Гц и 110–120 В, поэтому их техника без адаптера не работает у нас.'},
     {q:'Пик напряжения в розетке около…',opts:['220 В','311 В','50 В'],a:1,why:'Действующее 220 В — это «эквивалент по теплу», а пик синусоиды 220 × √2 ≈ 311 В.'},
     {q:'Трансформатор работает…',opts:['Только на переменном токе','На любом токе','Только на батарейках'],a:0,why:'Ему нужно меняющееся магнитное поле — постоянный ток его не даёт. Поэтому и ЛЭП переменные.'},
     {q:'Правильное отношение к розетке:',opts:['Изучать только с взрослыми, не разбирать','Можно разобрать, там интересно','Можно трогать мокрыми руками'],a:0,why:'220 В опасны для жизни. Изучаем схемно, через вилку — не вскрываем, не трогаем контакты.'}]},

{t:'Мультиметр',
 th:['<b>Мультиметр</b> — три прибора в одном: вольтметр, амперметр, омметр. Плюс «прозвонка».',
     '<b>Напряжение</b> измеряют <b>параллельно</b> детали: щупы касаются двух её точек, цепь не разрываем.',
     '<b>Ток</b> измеряют <b>в разрыв цепи</b>: цепь разрезаем и пропускаем ток через прибор.',
     '<b>Сопротивление</b> меряют только на обесточенной цепи! Под напряжением прибор покажет чепуху и может сгореть.',
     'Начинай с большего предела и снижай. Красный щуп — в гнездо VΩ, чёрный — в COM.',
     '<b>Прозвонка</b> (значок диода или звуковая волна) пищит, когда цепь целая. Так ищут обрывы и проверяют провода.',
     'Проверка батарейки: режим DC V 20. Красный щуп на «+», чёрный на «−». АА свежая — около 1,6 В, подсевшая — 1,2 и ниже.',
     '<b>Проверка LED</b> без схемы: режим прозвонки. Красный на анод, чёрный на катод — LED слабо светится. Меняешь ноги — темнота.',
     '<b>Проверка резистора</b>: режим Ω 200 (или больше). Если показания сильно расходятся с цветными полосками — резистор «умер».',
     'Никогда не мерь сопротивление <b>в схеме</b>, где есть питание: сначала выключи и разряди конденсаторы.',
     'Предохранитель мультиметра сгорает, если мерить ток в неправильном гнезде. Дорогое удовольствие — не повторяй.',
     'Словарик: <b>щупы</b> — провода прибора, <b>предел</b> — максимальное значение измерения, <b>прозвонка</b> — проверка целости.',
     '<b>Практика недели</b>: замерь напряжение батарейки АА, потом двух последовательно. Убедись: 1,5 + 1,5 = 3 В — точно как в теории.'],
 qs:[{q:'Что умеет мультиметр?',opts:['Мерить только напряжение','Напряжение, ток, сопротивление','Только светить'],a:1,why:'Три в одном: V, A, Ω. Плюс прозвонка — писк, если цепь целая.'},
     {q:'Напряжение измеряют…',opts:['Параллельно детали','В разрыв цепи','Через нос'],a:0,why:'Щупы прикладывают к двум точкам — цепь остаётся целой.'},
     {q:'Ток измеряют…',opts:['Параллельно','В разрыв цепи','На глаз'],a:1,why:'Разрываем цепь и включаем в неё мультиметр — весь ток течёт через прибор.'},
     {q:'Сопротивление меряют…',opts:['Только без питания','Только под напряжением','Включённым мотором'],a:0,why:'Только на обесточенной схеме. Под напряжением — неверные показания и риск сжечь прибор.'},
     {q:'Чёрный щуп вставляют в гнездо…',opts:['COM','VΩ','10A'],a:0,why:'COM — «общий», минус. Красный — в гнездо согласно измерению (VΩ или A).'}]},

{t:'Делитель напряжения',
 th:['<b>Делитель</b> — два резистора цепочкой: с их стыка снимают часть напряжения.',
     'Формула: <b>Uвых = Uвх × R2 / (R1 + R2)</b>, где R2 — нижний резистор.',
     '<b>Пример:</b> 9 В, R1 = 8 кОм, R2 = 1 кОм → Uвых = 9 × 1/9 = 1 В.',
     'Делитель — как кран: перекрывает «напор» ровно настолько, сколько нужно.',
     'На делителе строят датчики: фоторезистор + резистор = датчик света, терморезистор = датчик температуры.',
     '<b>Фоторезистор (LDR)</b> — резистор, который меняет сопротивление от света: на свету — сотни Ом, в темноте — миллионы.',
     '<b>Терморезистор</b> меняет сопротивление от температуры: тёплее — меньше сопротивление (NTC) — так меряют температуру.',
     'Если нижним резистором делителя поставить фоторезистор — при свете напряжение на выходе поднимется. Это готовый датчик света.',
     'Делитель <b>нельзя нагружать</b>: если подключить к выходу что-то с малым сопротивлением, оно «утащит» напряжение вниз. Нагрузка должна быть в 10 раз больше R2.',
     'Потенциометр — это подвижный делитель: крутишь ручку — меняется точка «стыка». Регулятор громкости — он.',
     'Проверь себя: 5 В, R1 = R2 = 10 кОм → выход 2,5 В. Ровно половина — самое частое деление.',
     'Словарик: <b>датчик</b> — деталь, превращающая свет/тепло/нажатие в электричество, <b>сигнал</b> — изменяющееся напряжение с информацией.',
     '<b>Практика недели</b>: собери делитель 10к + 10к от кроны 9 В. Мультиметр на выходе покажет 4,5 В. Замени нижний на фоторезистор — увидишь, как меняется от света.'],
 qs:[{q:'Делитель напряжения состоит из…',opts:['Двух резисторов','Двух светодиодов','Трансформатора'],a:0,why:'Два резистора цепочкой, выход снимается с их стыка.'},
     {q:'Uвых = ?',opts:['Uвх × R2/(R1+R2)','Uвх × R1+R2','Uвх / R2'],a:0,why:'Нижний резистор делим на сумму обоих — и умножаем на входное напряжение.'},
     {q:'9 В, R1 = 8 кОм, R2 = 1 кОм. Uвых?',opts:['1 В','9 В','72 В'],a:0,why:'9 × 1/(8+1) = 1 В. Проверь: сумма резисторов 9 кОм, доля нижнего — 1/9.'},
     {q:'Датчик света на фоторезисторе работает через…',opts:['Делитель напряжения','Трансформатор','Усилитель мощности'],a:0,why:'Фоторезистор меняет сопротивление от света — делитель превращает это в меняющееся напряжение.'},
     {q:'Если R2 увеличить, выходное напряжение…',opts:['Вырастет','Упадёт','Не изменится'],a:0,why:'Доля R2 в знаменателе растёт — снимаем больше напряжения со стыка.'}]},

{t:'Arduino и микроконтроллеры',
 th:['<b>Микроконтроллер</b> — крошечный компьютер на одной микросхеме. <b>Arduino</b> — плата с ним, созданная для обучения.',
     'У Arduino есть <b>цифровые пины</b> (вкл/выкл, 0 или 1) и <b>аналоговые входы</b> (читают напряжение 0–5 В числом 0–1023).',
     'Программа называется <b>скетч</b>. Первая программа каждого ардуинщика — мигание светодиодом: «Hello, world» электроники.',
     'Скетч состоит из setup() (запускается раз) и loop() (крутится вечно).',
     'Светодиод к Arduino всё равно подключают через резистор 220–330 Ом — правило недели 5 никто не отменял.',
     '<b>АЦП</b> — аналого-цифровой преобразователь: переводит напряжение в число. 10-битный АЦП даёт 1024 уровня.',
     '<b>ШИМ (PWM)</b> — быстрое мигание, которое выглядит как «половинная яркость». Так регулируют яркость LED и скорость моторов.',
     'Arduino питается от USB (5 В) или от кроны через разъём. Пины выдают максимум 20 мА — этого хватает на LED, но не на мотор.',
     'Для моторов нужен <b>драйвер</b> (например, L293D): Arduino командует, драйвер раздаёт силу. Мотор напрямую к пину подключать нельзя.',
     'Сенсорные модули: датчик температуры, ультразвуковой дальномер, сервопривод — подключаются к пинам и читаются парой строк кода.',
     'Первая схема: LED → резистор 220 Ом → пин 13. В скетче: pinMode(13, OUTPUT); и digitalWrite(13, HIGH); в loop с задержкой.',
     'Словарик: <b>скетч</b> — программа, <b>пин</b> — нога платы, <b>шилд</b> — плата-расширение, <b>загрузка</b> — перенос кода в плату.',
     '<b>Практика недели</b>: если есть Arduino — собери Blink из урока 1 на официальном сайте. Если нет — напиши скетч на бумаге: это тоже тренировка.'],
 qs:[{q:'Что такое Arduino?',opts:['Микроконтроллерная плата для обучения','Марка резисторов','Язык программирования'],a:0,why:'Плата с микроконтроллером ATmega. Идеальна для первых шагов в программной электронике.'},
     {q:'Цифровой пин может быть…',opts:['Вкл или выкл (0 или 1)','Любым числом от 0 до 1023','Только мигать'],a:0,why:'Цифровой — два состояния. Аналоговый вход читает 0–1023 уровня.'},
     {q:'Первая программа ардуинщика…',opts:['Мигание светодиодом','Управление роботом','Квадрокоптер'],a:0,why:'«Blink» — hello world электроники: мгновенная наглядная победа.'},
     {q:'setup() выполняется…',opts:['Один раз при включении','Каждую секунду','Никогда'],a:0,why:'setup() — раз: настраиваем пины. loop() — бесконечно: основная работа.'},
     {q:'Светодиод к пину Arduino подключают…',opts:['Напрямую, без ничего','Через резистор 220–330 Ом','Через трансформатор'],a:1,why:'Пин выдаёт 5 В — без резистора ток превысит лимит и LED (или пин) пострадает.'}]}
];

var BQ = [
{q:'Что означает аббревиатура DC?',opts:['Direct Current — постоянный ток','Direct Circuit — прямая цепь','Dynamic Charge — динамический заряд'],a:0,why:'DC — Direct Current (постоянный ток), AC — Alternating Current (переменный).'},
{q:'Как меняется напряжение в бытовой сети?',opts:['Не меняется никогда','Меняется по синусоиде: от плюса к минусу и обратно','Скачет случайным образом'],a:1,why:'Классическая синусоида от +311 В до −311 В. Откуда 311? Это пик при действующих 220 В.'},
{q:'Какое напряжение и частота в розетке в России?',opts:['220 В, 50 Гц','110 В, 60 Гц','380 В, 50 Гц'],a:0,why:'220 В / 50 Гц. В США — 110–120 В / 60 Гц, поэтому их техника без адаптера не работает у нас.'},
{q:'Что означает частота 50 Гц?',opts:['50 колебаний напряжения в секунду','50 ватт мощности','50 фаз в сети'],a:0,why:'Ток проходит полный цикл «плюс–минус–плюс» 50 раз в секунду. Период цикла T = 1/50 = 0,02 с — всего 20 мс.'},
{q:'Какой ток даёт батарейка АА?',opts:['Переменный, 50 Гц','Постоянный','Импульсный'],a:1,why:'Постоянный и стабильный — на этом держится вся портативная электроника.'},
{q:'Напряжение измеряется в…',opts:['амперах','вольтах','омах'],a:1,why:'Вольты — «давление», амперы — «поток», омы — «тормоз».'},
{q:'1000 миллиампер — это…',opts:['1 ампер','1 вольт','1 ватт'],a:0,why:'милли = тысячная доля. 1000 мА = 1 А. Ток зарядки телефона — примерно 1–2 А.'},
{q:'Что является изолятором?',opts:['Медь','Резина','Алюминий'],a:1,why:'Резина и пластик не проводят ток — поэтому провода в них и упакованы.'},
{q:'Почему провода покрывают изоляцией?',opts:['Чтобы ток шёл только внутри','Для красоты','Чтобы провод не грелся'],a:0,why:'Без изоляции провода замкнутся друг на друга или ударят током прикоснувшегося.'},
{q:'Ток — это…',opts:['Движение заряженных частиц','Скопление электронов без движения','Свет в проводе'],a:0,why:'Ток — именно движение зарядов, как поток воды в трубе.'},
{q:'Закон Ома связывает…',opts:['Ток, напряжение и сопротивление','Цвет и мощность','Частоту и ватты'],a:0,why:'I = U/R — треугольник Ома: U сверху, I и R снизу. Закрой пальцем неизвестную — увидишь формулу.'},
{q:'12 В и сопротивление 400 Ом. Ток?',opts:['30 мА','4800 А','3,3 А'],a:0,why:'I = 12/400 = 0,03 А = 30 мА.'},
{q:'Мощность измеряется в…',opts:['ваттах','вольтах','фарадах'],a:0,why:'Ватт (Вт) = вольт × ампер. Лампочка 60 Вт, чайник ~1800 Вт.'},
{q:'Если напряжение выросло вдвое при том же R, ток…',opts:['Вырос вдвое','Упал вдвое','Не изменился'],a:0,why:'I = U/R — линейная зависимость: U × 2 → I × 2.'},
{q:'Кто сформулировал закон I = U/R?',opts:['Георг Ом','Альберт Эйнштейн','Никола Тесла'],a:0,why:'Георг Симон Ом, немецкий физик, 1826 год. Его имя носит и единица сопротивления.'},
{q:'Резистор на схеме обозначают…',opts:['Прямоугольником или зигзагом','Кружком со стрелкой','Треугольником'],a:0,why:'В европейских схемах — прямоугольник, в американских — зигзаг. Оба означают резистор.'},
{q:'Красный–красный–коричневый — это…',opts:['220 Ом','22 Ом','2,2 кОм'],a:0,why:'2, 2, ×10 = 220 Ом. Частый номинал для светодиодов.'},
{q:'Жёлтый–фиолетовый–оранжевый — это…',opts:['47 кОм','4,7 Ом','470 Ом'],a:0,why:'4, 7, ×1000 = 47 000 Ом = 47 кОм.'},
{q:'Зачем у резистора допуск?',opts:['Показывает разброс реального номинала','Это про мощность','Так красивее'],a:0,why:'±5% значит: 1 кОм может быть 950–1050 Ом. Для учебных схем это не критично.'},
{q:'Последовательные резисторы 1 кОм и 2,2 кОм дают…',opts:['3,2 кОм','1,2 кОм','0,7 кОм'],a:0,why:'Последовательно складываются: 1 + 2,2 = 3,2 кОм.'},
{q:'Что такое действующее значение напряжения (RMS)?',opts:['Максимальный пик','Эквивалент по мощности: постоянное напряжение, дающее то же тепло','Среднее арифметическое'],a:1,why:'Для синуса: U_RMS = U_пик / √2. Пик 311 В даёт те самые 220 В действующих.'},
{q:'Что делает диод в цепи переменного тока?',opts:['Пропускает ток только в одну сторону — выпрямляет','Усиливает сигнал','Меняет частоту'],a:0,why:'Диод — односторонний клапан. Мост из четырёх диодов выпрямляет обе полуволны.'},
{q:'Катод светодиода — это…',opts:['Минус, короткая нога','Плюс, длинная нога','Центр корпуса'],a:0,why:'Катод — минус: короткая нога и спил на ободке. Анод — длинная нога, плюс.'},
{q:'Резистор для красного LED от 5 В чаще всего…',opts:['220 Ом','10 кОм','1 Ом'],a:0,why:'R = (5 − 2) / 0,015 ≈ 200 Ом → берём 220 Ом стандартный. Поток ~15 мА.'},
{q:'Как соединяют светодиоды в длинную гирлянду от одного питания?',opts:['Последовательно с ограничением тока','Все напрямую к батарейке','Через трансформатор каждый'],a:0,why:'Последовательная цепочка LED с резистором — так одна ветка ест мало тока.'},
{q:'Что внутри зарядки превращает переменный ток в постоянный?',opts:['Трансформатор','Выпрямитель (диодный мост) + сглаживающий конденсатор','Генератор'],a:1,why:'Цепочка: преобразователь → диодный мост → конденсатор-фильтр → стабилизатор. Писк дешёвой зарядки — импульсный преобразователь.'},
{q:'Что сделает конденсатор с идеальным постоянным током?',opts:['Зарядится, и ток прекратится','Будет пропускать ток как проводник','Нагреется до отказа'],a:0,why:'Для постоянного тока конденсатор — разрыв цепи после заряда. А вот переменный он пропускает.'},
{q:'1 мкФ — это…',opts:['Миллионная фарады','Тысяча фарад','Миллиард фарад'],a:0,why:'микро = 10⁻⁶. Пикофарада — 10⁻¹²: 1 мкФ = 1 000 000 пФ.'},
{q:'Полярный конденсатор подключили наоборот. Что может случиться?',opts:['Нагреется и выйдет из строя','Ничего','Увеличит ёмкость'],a:0,why:'Электролит внутри закипает, давление растёт — конденсатор может вздуться и «пукнуть».'},
{q:'Конденсатор в блоке питания ставят, чтобы…',opts:['Сгладить пульсации после выпрямителя','Усилить ток','Охладить схему'],a:0,why:'Диодный мост даёт пульсирующий ток, конденсатор его «выравнивает» — как амортизатор.'},
{q:'Ёлочная гирлянда моргает. Какой элемент за это отвечает?',opts:['Конденсатор или контроллер','Резистор','Трансформатор'],a:0,why:'Моргалки строят на накоплении-разряде конденсатора или на контроллере, задающем ритм.'},
{q:'База транзистора — это…',opts:['Управляющая нога','Силовой выход','Корпус'],a:0,why:'Малый ток базы управляет большим током коллектор–эмиттер. Так работает ключ и усилитель.'},
{q:'Почему ЛЭП исторически строят на переменном токе?',opts:['Напряжение легко повышать и понижать трансформатором — меньше потерь','Он «сильнее»','Так случайно сложилось'],a:0,why:'Трансформатор работает только на переменном: подняли до сотен тысяч вольт — потери на нагрев в разы меньше.'},
{q:'Что будет, если снять радиатор с мощного транзистора?',opts:['Перегреется и сгорит','Будет работать как раньше','Станет мощнее'],a:0,why:'Мощность греет кристалл. Радиатор отводит тепло — без него транзистор умрёт.'},
{q:'Сколько транзисторов может быть в современном процессоре?',opts:['Миллиарды','Десятки','Один'],a:0,why:'Свыше 10 миллиардов в топовых чипах — каждая наноскопка это ключик 0/1.'},
{q:'Куда втыкать провода на макетной плате?',opts:['В гнёзда, внутри уже есть соединения','Приклеивать','Припаивать обязательно'],a:0,why:'Breadboard соединён группами гнёзд — пайка не нужна. Собираем и разбираем сколько угодно.'},
{q:'Средние ряды макетки соединены…',opts:['Вертикально с разрывом посередине','Горизонтально вдоль всей платы','Не соединены'],a:0,why:'Столбики по 5 гнёзд с разрывом в центре — под микросхемы. Шины питания идут вдоль.'},
{q:'Холодная пайка выглядит…',opts:['Матовой и серой','Блестящей','Прозрачной'],a:0,why:'Олово не растеклось — контакт ненадёжный. Греем заново до блеска.'},
{q:'Главное правило работы с паяльником:',opts:['Кладём только на подставку, берём за ручку','Дуем на жало','Трогаем кончиком пальца'],a:0,why:'Жало ~300 °C. Паяльник всегда на подставке, за ручку, жало — от себя и от товарищей.'},

/* ================= ХРАНИЛИЩЕ ================= */
function load(k, def) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch(e) { return def; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }

var USERS = load('ye_users', []);
var CUR = -1;
var PARENT = load('ye_parent', '');

function curUser() { return CUR >= 0 ? USERS[CUR] : null; }
function mySave() { save('ye_users', USERS); }

function rankOf(xp) {
  var r = 0;
  for (var i = 0; i < RANKS.length; i++) if (xp >= RANKS[i].xp) r = i;
  return r;
}
function nextRank(xp) {
  for (var i = 0; i < RANKS.length; i++) if (xp < RANKS[i].xp) return RANKS[i];
  return null;
}
/* Титул пользователя: у родителя-админа — свой, вне лесенки */
function titleOf(u) {
  if (u.admin) return {e:'👑', n:'СУПЕР ПАПОЧКА'};
  return RANKS[rankOf(u.xp)];
}
function weekCount(u) { return u.weeks.filter(function(x){ return x >= 4; }).length; }
function lawsCount(u) { return u.laws.filter(function(x){ return x; }).length; }

function checkBadges(u) {
  var before = u.badges.length;
  var w = weekCount(u), l = lawsCount(u), b = u.best || 0;
  function has(id){ return u.badges.indexOf(id) >= 0; }
  function give(id){ if (!has(id)) u.badges.push(id); }
  if (u.testsDone >= 1) give('first');
  if (b >= 10) give('ten');
  if (b >= 25) give('half');
  if (b >= 45) give('near');
  if (w >= 1) give('w1');
  if (w >= 6) give('w6');
  if (w >= 12) give('w12');
  if (l >= 8) give('laws');
  if (u.calcUsed) give('calc');
  if (u.badges.length > before) mySave();
  return u.badges.length - before;
}

function addXP(n) {
  var u = curUser(); if (!u) return;
  var oldRank = rankOf(u.xp);
  u.xp += n;
  checkBadges(u);
  var newRank = rankOf(u.xp);
  mySave();
  if (newRank > oldRank && !u.admin) toast('🎉 Новый ранг: ' + RANKS[newRank].e + ' ' + RANKS[newRank].n + '!');
}

var toastTimer = null;
function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.style.display = 'none'; }, 3200);
}

/* ================= ТАП-ЗАЩИТА ================= */
var tS = {x:0, y:0}, tMoved = false;
function bindTap(el, fn) {
  if (!el) return;
  el.addEventListener('pointerdown', function(e) {
    if (e.pointerType === 'mouse') { return; }
    tS = {x:e.clientX, y:e.clientY}; tMoved = false; el.__down = true;
  }, {passive:true});
  el.addEventListener('pointermove', function(e) {
    if (el.__down && (Math.abs(e.clientX - tS.x) > 12 || Math.abs(e.clientY - tS.y) > 12)) { tMoved = true; el.__down = false; }
  }, {passive:true});
  el.addEventListener('pointerup', function(e) {
    if (el.__down && !tMoved) fn();
    el.__down = false;
  }, {passive:true});
  el.addEventListener('click', function(e) {
    if (e.detail !== 0 && !('ontouchstart' in window)) fn();
  });
}

/* ================= НАВИГАЦИЯ ================= */
function show(id) {
  var s = document.querySelectorAll('.screen');
  for (var i = 0; i < s.length; i++) s[i].classList.remove('active');
  document.getElementById(id).classList.add('active');
  var tabs = document.querySelectorAll('#nav div');
  for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('on');
  for (var i = 0; i < tabs.length; i++) if (tabs[i].getAttribute('data-t') === id) tabs[i].classList.add('on');
  window.scrollTo(0, 0);
}
var tabs = document.querySelectorAll('#nav div');
for (var i = 0; i < tabs.length; i++) (function(t) {
  bindTap(t, function(){ show(t.getAttribute('data-t')); render(); });
})(tabs[i]);

      (err ? '<div class="card" style="border-color:#f87171;color:#f87171;font-size:.9rem">' + err + '</div>' : '') +
      '<input id="rName" placeholder="Имя" autocapitalize="sentences">' +
      '<input id="rPhone" inputmode="numeric" placeholder="Телефон или логин (напр. +7999...)">' +
      '<input id="rPin" inputmode="numeric" maxlength="4" placeholder="ПИН из 4 цифр">' +
      (USERS.length > 0 ? '<input id="rInv" placeholder="Код приглашения от родителя">' : '') +
      '<div class="btn" id="rGo">Создать профиль</div>' +
      '<div class="row"><div class="btn btn2" id="rBack">← Назад</div></div>' +

      '<p class="sub">Введите телефон (логин) и ПИН, чтобы войти.</p>' +
      (err ? '<div class="card" style="border-color:#f87171;color:#f87171;font-size:.9rem">' + err + '</div>' : '') +
      '<input id="lPhone" inputmode="numeric" placeholder="Телефон или логин">' +
      '<input id="lPin" inputmode="numeric" maxlength="4" placeholder="ПИН">' +
      '<div class="btn" id="lGo">Войти</div>' +
      '<div class="row"><div class="btn btn2" id="lReg">+ Новый профиль</div></div>' +
      '<div class="ver">версия 12 • Лаборатория юного электронщика</div>';
    bindTap(document.getElementById('lReg'), function(){ renderAuth('reg'); });
    bindTap(document.getElementById('lGo'), doLogin);
  }
}

function doReg() {
  var name = document.getElementById('rName').value.trim();
  var phone = document.getElementById('rPhone').value.trim();
  var pin = document.getElementById('rPin').value.trim();
  var inv = document.getElementById('rInv') ? document.getElementById('rInv').value.trim() : '';
  if (!name) { renderAuth('reg', 'Введите имя.'); return; }
  if (!phone) { renderAuth('reg', 'Введите телефон или логин.'); return; }
  if (!/^\d{4}$/.test(pin)) { renderAuth('reg', 'ПИН — ровно 4 цифры.'); return; }
  for (var i = 0; i < USERS.length; i++) if (USERS[i].phone === phone) { renderAuth('reg', 'Такой логин уже есть.'); return; }
  if (USERS.length > 0 && inv !== PARENT) { renderAuth('reg', 'Неверный код приглашения. Спросите у родителя.'); return; }
  var isAdmin = USERS.length === 0;
  if (isAdmin) PARENT = ('' + Math.floor(100000 + Math.random() * 900000));
  USERS.push({name:name, phone:phone, pin:pin, admin:isAdmin, xp:0, badges:[], weeks:new Array(12).fill(0), theory:new Array(12).fill(false), laws:new Array(8).fill(false), best:0, testsDone:0, calcUsed:false});
  mySave(); save('ye_parent', PARENT);
  CUR = USERS.length - 1; save('ye_cur', CUR);
  enterLab(isAdmin ? '👑 Добро пожаловать, СУПЕР ПАПОЧКА! Код приглашения: ' + PARENT : '🧪 Добро пожаловать, ' + name + '!');
}
function doLogin() {
  var phone = document.getElementById('lPhone').value.trim();
  var pin = document.getElementById('lPin').value.trim();
  for (var i = 0; i < USERS.length; i++) {
    if (USERS[i].phone === phone && USERS[i].pin === pin) {
      CUR = i; save('ye_cur', CUR);
      enterLab('🔓 Открыто! Привет, ' + USERS[i].name + '.');
      return;
    }
  }
  renderAuth('login', 'Не совпадает. Проверьте телефон и ПИН.');
}

function enterLab(msg) {
  document.getElementById('nav').classList.remove('hidden');
  toast(msg);
  show('s_home'); render();
}

function logout() {
  CUR = -1; save('ye_cur', -1);
  document.getElementById('nav').classList.add('hidden');
  renderAuth('login');
  show('s_auth');
}

  renderProfile(u);
  renderGTO(u);
  renderAdmin(u);
}

    html =
    '<h1>👑 <span class="gold">' + u.name + '</span></h1>' +
    '<p class="sub"><span class="gold">СУПЕР ПАПОЧКА</span> — главный хранитель лаборатории. ' + u.xp + ' XP • зачтено недель: ' + w + '</p>' +
    '<div class="bar"><i style="width:100%"></i></div>';

    '<h1>' + t.e + ' ' + u.name + '</h1>' +
    '<p class="sub">' + t.n + ' • ' + u.xp + ' XP' + (nr ? ' • до «' + nr.n + '»: ' + (nr.xp - u.xp) + ' XP' : ' • максимум!') + '</p>' +

      '<div class="tile" id="tWeek"><div class="ic">📚</div><div class="tt">Тема недели</div><div class="ds">Неделя ' + (curWeek + 1) + ': ' + WEEKS[curWeek].t + '</div></div>' +
      '<div class="tile" id="tBig"><div class="ic">🎯</div><div class="tt">Большой тест</div><div class="ds">50 вопросов • лучший: ' + (u.best || 0) + '</div></div>' +
      '<div class="tile" id="tLaws"><div class="ic">⚖️</div><div class="tt">Законы — выучить</div><div class="ds">' + lawsCount(u) + ' из 8 карточек</div></div>' +
      '<div class="tile" id="tCheat"><div class="ic">📖</div><div class="tt">Шпаргалка</div><div class="ds">Формулы и таблицы</div></div>' +
      '<div class="tile" id="tExp"><div class="ic">🔬</div><div class="tt">Опыты дома</div><div class="ds">4 эксперимента</div></div>' +
      '<div class="tile" id="tLed"><div class="ic">💡</div><div class="tt">LED-считалка</div><div class="ds">Резистор для светодиода</div></div>' +
      '<div class="tile" id="tCalc"><div class="ic">🧮</div><div class="tt">Цвета резистора</div><div class="ds">Расшифровать полоски</div></div>' +
      (u.admin ? '<div class="tile" id="tAdmin"><div class="ic">👨‍🔬</div><div class="tt">Панель родителя</div><div class="ds">Коды и таблица</div></div>' : '') +
    '</div>' +
    '<div class="ver">версия 12 • курс 12 недель • XP: ' + u.xp + '</div>';
  var box = document.getElementById('s_home');
  box.innerHTML = html;
  bindTap(document.getElementById('tWeek'), function(){ openWeek(firstOpenWeek(u)); });
  bindTap(document.getElementById('tBig'), function(){ startBig(); });
  bindTap(document.getElementById('tLaws'), function(){ show('s_laws'); });
  bindTap(document.getElementById('tCheat'), function(){ show('s_cheat'); });
  bindTap(document.getElementById('tExp'), function(){ show('s_exp'); });
  bindTap(document.getElementById('tLed'), function(){ show('s_led'); });
  bindTap(document.getElementById('tCalc'), function(){ renderCalc(); show('s_calc'); });
  if (u.admin) bindTap(document.getElementById('tAdmin'), function(){ show('s_admin'); });
}

function firstOpenWeek(u) {
  for (var i = 0; i < 12; i++) { if (!u.weeks[i] || u.weeks[i] < 4) return i; }
  return 11;
}

/* ================= КУРС ================= */
function renderCourse(u) {
  var html = '<div class="topbar"><h2>📚 Курс: 12 недель</h2></div>' +
    '<p class="sub">Каждая неделя: сначала материал → потом контрольная. Зачёт с 4 из 5.</p>';
  for (var i = 0; i < WEEKS.length; i++) {
    var unlocked = i === 0 || u.weeks[i - 1] >= 4;
    var sc = u.weeks[i] || 0;
    var tag = sc >= 4 ? '<span class="tag ok">зачёт ' + sc + '/5</span>' : (sc > 0 ? '<span class="tag warn">' + sc + '/5</span>' : '') + (unlocked ? '' : '<span class="tag done">🔒 закрыта</span>');
    html += '<div class="card' + (unlocked ? '' : ' locked') + '" data-w="' + i + '">' +
      '<div class="wt">Неделя ' + (i + 1) + '. ' + WEEKS[i].t + '</div>' +
      '<div class="wd">' + tag + 'Порядок: материал → контрольная.</div></div>';
  }
  var box = document.getElementById('s_course');
  box.innerHTML = html;
  var cards = box.querySelectorAll('[data-w]');
  for (var i = 0; i < cards.length; i++) (function(c) {
    bindTap(c, function() {
      var idx = parseInt(c.getAttribute('data-w'), 10);
      if (idx === 0 || u.weeks[idx - 1] >= 4) openWeek(idx);
      else toast('🔒 Сначала зачтите предыдущую неделю.');
    });
  })(cards[i]);
}

function openWeek(i) {
  var u = curUser(); if (!u) return;
  var box = document.getElementById('s_week');
  box.innerHTML =
    '<div class="topbar"><h2>Неделя ' + (i + 1) + ': ' + WEEKS[i].t + '</h2><div class="xbtn" id="wBack">✕</div></div>' +
    '<p class="sub">Материал недели (' + WEEKS[i].th.length + ' карточек). Читай внимательно — потом контрольная.</p>' +
    '<div class="theory">' + WEEKS[i].th.map(function(x){ return '<div>' + x + '</div>'; }).join('') + '</div>' +
    (u.theory[i] ? '' : '<div class="btn" id="wRead">✓ Я изучил материал</div>') +
    '<div class="btn ' + (u.theory[i] ? '' : 'btn2') + '" id="wTest" style="' + (u.theory[i] ? '' : 'margin-top:10px') + '">Пройти контрольную (5 вопросов)</div>' +
    '<div class="row"><div class="btn btn2" id="wBack2">← К курсу</div></div>';
  bindTap(document.getElementById('wBack'), function(){ show('s_course'); });
  bindTap(document.getElementById('wBack2'), function(){ show('s_course'); });
  var rb = document.getElementById('wRead');
  if (rb) bindTap(rb, function() {
    u.theory[i] = true; mySave();
    toast('📖 Материал изучен — контрольная открыта!');
    addXP(2);
    openWeek(i);
  });
  bindTap(document.getElementById('wTest'), function() {
    if (!u.theory[i]) { toast('📖 Сначала прочитайте материал и нажмите «Я изучил».'); return; }
    startWeek(i);
  });
  show('s_week');
}

/* ================= ТЕСТЫ ================= */
var T = null;

function renderTest() {
  var q = T.list[T.cur];
  document.getElementById('tQnum').textContent = 'Вопрос ' + (T.cur + 1) + ' / ' + T.list.length;
  document.getElementById('tBar').style.width = (T.cur / T.list.length * 100) + '%';
  document.getElementById('tQ').textContent = q.q;
  var box = document.getElementById('tOpts');
  box.innerHTML = '';
  var letters = ['А', 'Б', 'В'];
  for (var i = 0; i < q.opts.length; i++) {
    var d = document.createElement('div');
    d.className = 'opt';
    d.innerHTML = '<span>' + letters[i] + ') ' + q.opts[i] + '</span><span class="mark">✓</span>';
    (function(idx, el) {
      bindTap(el, function() {
        T.picked[T.cur] = idx;
        var all = box.children;
        for (var k = 0; k < all.length; k++) all[k].classList.remove('sel');
        el.classList.add('sel');
        buzz(20);
        document.getElementById('tNext').disabled = false;
        document.getElementById('tNext').textContent = (T.cur === T.list.length - 1) ? 'Завершить' : 'Дальше →';
      });
    })(i, d);
    box.appendChild(d);

/* Код результата для ГТО */
function makeCode(name, week, score, xp) {
  var nm = String(name).toUpperCase();
  var tail = 'W' + week + '|S' + score + '|X' + xp;
  var all = nm + '|' + tail;
  var sum = 0;
  for (var i = 0; i < all.length; i++) sum += all.charCodeAt(i);
  return all + '|' + String.fromCharCode(65 + sum % 26);
}
function parseCode(c) {
  c = c.trim().replace(/\s+/g, '');
  var p = c.split('|');
  if (p.length !== 5) return null;
  var all = p[0].toUpperCase() + '|' + p[1].toUpperCase() + '|' + p[2].toUpperCase() + '|' + p[3].toUpperCase();
  var sum = 0;
  for (var i = 0; i < all.length; i++) sum += all.charCodeAt(i);
  if (p[4].toUpperCase() !== String.fromCharCode(65 + sum % 26)) return null;
  var w = parseInt(p[1].substring(1), 10);
  var sc = parseInt(p[2].substring(1), 10);
  var xp = parseInt(p[3].substring(1), 10);
  if (isNaN(w) || isNaN(sc) || isNaN(xp)) return null;
  return {name:p[0], week:w, score:sc, xp:xp};
}

    '<div class="wd" style="text-align:center">расчёт: ' + (LEDC.up) + ' − ' + LEDC.uv + ' = ' + (LEDC.up - LEDC.uv).toFixed(1) + ' В; ' + (LEDC.up - LEDC.uv).toFixed(1) + ' / ' + (LEDC.i / 1000) + ' А = ' + Math.round(r) + ' Ом → ближайший стандартный</div></div>' +
    '<div class="row"><div class="btn btn2" id="ldBack2">← На главную</div></div>';
  var box = document.getElementById('s_led');
  box.innerHTML = html;
  bindTap(document.getElementById('ldBack'), function(){ show('s_home'); });
  bindTap(document.getElementById('ldBack2'), function(){ show('s_home'); });
  var els = box.querySelectorAll('[data-up]');
  for (var i = 0; i < els.length; i++) (function(e) { bindTap(e, function(){ LEDC.up = parseFloat(e.getAttribute('data-up')); renderLed(); }); })(els[i]);
  els = box.querySelectorAll('[data-uv]');
  for (var i = 0; i < els.length; i++) (function(e) { bindTap(e, function(){ LEDC.uv = parseFloat(e.getAttribute('data-uv')); renderLed(); }); })(els[i]);
  els = box.querySelectorAll('[data-i]');
  for (var i = 0; i < els.length; i++) (function(e) { bindTap(e, function(){ LEDC.i = parseFloat(e.getAttribute('data-i')); renderLed(); }); })(els[i]);
}
function nearStd(r) {
  var std = [10, 22, 47, 100, 150, 220, 330, 470, 680, 1000, 1500, 2200, 3300, 4700, 10000];
  for (var i = 0; i < std.length; i++) {
    if (r <= std[i]) return std[i] >= 1000 ? (std[i] / 1000) + ' кОм' : std[i] + ' Ом';
  }
  return Math.round(r) + ' Ом';
}

/* ================= ГТО ================= */
function renderGTO(u) {
  var board = load('ye_board', []);
  var me = titleOf(u);
  var html = '<div class="topbar"><h2>🏆 Состязание ГТО</h2></div>' +
    '<p class="sub">Прошёл контрольную — получи код результата и отправь родителю. Родитель вносит код в таблицу.</p>';
  html += '<div class="lbrow"><div class="pos">You</div><div class="nm">' + u.name + '<small>' + weekCount(u) + ' недель • ' + me.e + ' ' + me.n + '</small></div><div class="xp">' + u.xp + ' XP</div></div>';
  if (u.admin) {
    html += '<h2>Внести код результата</h2>' +
      '<input id="admCode" placeholder="Например: МИША|W3|S5|X210|К">' +
      '<div class="btn" id="admAdd">+ Внести в таблицу</div>';
  }
  html += '<h2>Таблица участников</h2>';
  var rows = board.slice(0);
  rows.push({name:u.name + ' (ты)', xp:u.xp, weeks:weekCount(u), self:true});
  var agg = {};
  for (var i = 0; i < rows.length; i++) {
    var key = rows[i].name;
    if (!agg[key]) agg[key] = {name:key, xp:rows[i].xp, weeks:rows[i].weeks, self:rows[i].self};
    else { agg[key].xp = Math.max(agg[key].xp, rows[i].xp); agg[key].weeks = Math.max(agg[key].weeks, rows[i].weeks); agg[key].self = agg[key].self || rows[i].self; }
  }
  var list = [];
  for (var k in agg) list.push(agg[k]);
  list.sort(function(a, b){ return b.xp - a.xp; });
  for (var i = 0; i < list.length; i++) {
    var lt = list[i].self ? me : RANKS[rankOf(list[i].xp)];
    html += '<div class="lbrow"' + (list[i].self ? ' style="border-color:#3d7bff"' : '') + '><div class="pos">' + (i + 1) + '</div><div class="nm">' + list[i].name + '<small>' + list[i].weeks + ' недель зачтено • ' + lt.e + ' ' + lt.n + '</small></div><div class="xp">' + list[i].xp + '</div></div>';
  }
  if (list.length <= 1) html += '<div class="card"><div class="wd">Пока в таблице только ты. Коды результатов добавит родитель в своей панели.</div></div>';
  var box = document.getElementById('s_gto');
  box.innerHTML = html;
  if (u.admin) {
    bindTap(document.getElementById('admAdd'), function() {
      var c = document.getElementById('admCode').value;
      var res = parseCode(c);
      if (!res) { toast('❌ Код не распознан или повреждён.'); return; }
      var board = load('ye_board', []);
      for (var i = 0; i < board.length; i++) if (board[i].code === c.trim()) { toast('Этот код уже внесён.'); return; }
      board.push({name:res.name, xp:res.xp, weeks:res.week, score:res.score, code:c.trim(), ts:Date.now()});
      save('ye_board', board);
      toast('🏆 + ' + res.name + ': ' + res.xp + ' XP (неделя ' + res.week + ')');
      renderGTO(curUser());
    });
  }
}

/* ================= ПРОФИЛЬ ================= */
function renderProfile(u) {
  var me = titleOf(u);
  var html = '<div class="topbar"><h2>👤 Профиль</h2></div>' +
    '<div class="card" style="border-color:' + (u.admin ? '#fbbf24' : '#262d3a') + '"><div class="wt">' + me.e + ' ' + me.n + '</div>';
  if (u.admin) {
    html += '<div class="wd"><b class="gold">' + u.name + '</b> — главный хранитель лаборатории. Лесенка рангов покорена вами ещё до её существования. Теперь ваша задача — растить электронщиков.</div>' +
      '<div class="wd">' + u.xp + ' XP • недель зачтено: ' + weekCount(u) + ' из 12 • законов выучено: ' + lawsCount(u) + ' из 8 • лучший большой тест: ' + (u.best || 0) + '/50</div></div>' +
      '<p class="sub">Лесенка рангов ниже — для учеников. Вы уже прошли её весь 🫡</p>';
  } else {
    html += '<div class="wd">' + me.n + ' • ' + u.xp + ' XP • недель зачтено: ' + weekCount(u) + ' из 12 • законов выучено: ' + lawsCount(u) + ' из 8 • лучший большой тест: ' + (u.best || 0) + '/50</div></div>';
  }
  html += '<h2>Лесенка рангов</h2>';
  for (var i = 0; i < RANKS.length; i++) {
    html += '<div class="lbrow"><div class="pos">' + RANKS[i].e + '</div><div class="nm">' + RANKS[i].n + '<small>' + RANKS[i].xp + ' XP</small></div><div class="xp">' + (u.xp >= RANKS[i].xp ? '✓' : '🔒') + '</div></div>';
  }
  html += '<h2>Значки</h2><div>';
  for (var i = 0; i < BADGES.length; i++) {
    var has = u.badges.indexOf(BADGES[i].id) >= 0;
    html += '<div class="bdg ' + (has ? 'yes' : 'no') + '"><span class="bi">' + BADGES[i].ic + '</span><b>' + BADGES[i].t + '</b><br>' + BADGES[i].d + '</div>';
  }
  html += '</div>';
  if (u.admin) html += '<div class="btn btn2" id="pAdmin" style="margin-top:10px">👨‍🔬 Панель родителя</div>';
  html += '<div class="btn btn2" id="pOut" style="margin-top:10px">🚪 Выйти из профиля</div>' +
    '<div class="ver">версия 12 • данные хранятся на этом устройстве</div>';
  var box = document.getElementById('s_prof');
  box.innerHTML = html;
  bindTap(document.getElementById('pOut'), logout);
  if (u.admin) bindTap(document.getElementById('pAdmin'), function(){ show('s_admin'); });
}

/* ================= ПАНЕЛЬ РОДИТЕЛЯ ================= */
function renderAdmin(u) {
  if (!u || !u.admin) return;
  var board = load('ye_board', []);
  var html = '<div class="topbar"><h2>👨‍🔬 Панель СУПЕР ПАПОЧКИ</h2><div class="xbtn" id="aBack">✕</div></div>' +
    '<div class="card"><div class="wt">Код приглашения для учеников</div><div class="wd" style="font-size:1.3rem;font-weight:700;color:#7fa8ff">' + PARENT + '</div><div class="wd">Ученик при регистрации вводит этот код. Телефоны в код сайта не попадают — они только на устройствах.</div></div>' +
    '<div class="card"><div class="wt">Участники на этом устройстве</div>' +
    USERS.map(function(x){ return '<div class="wd">• ' + x.name + ' — ' + x.xp + ' XP' + (x.admin ? ' (СУПЕР ПАПОЧКА)' : '') + '</div>'; }).join('') + '</div>' +
    '<h2>Внести коды результатов</h2>' +
    '<input id="admCode2" placeholder="Код вида: МИША|W3|S5|X210|К">' +
    '<div class="btn" id="admAdd2">+ Внести в таблицу ГТО</div>' +
    '<h2>Таблица ГТО (' + board.length + ')</h2>';
  for (var i = 0; i < board.length; i++) {
    html += '<div class="lbrow"><div class="pos">' + (i + 1) + '</div><div class="nm">' + board[i].name + '<small>неделя ' + board[i].weeks + ' • ' + board[i].score + '/5</small></div><div class="xp">' + board[i].xp + '</div></div>';
  }
  if (!board.length) html += '<div class="card"><div class="wd">Пока пусто. Ученики присылают коды — вносите их сюда.</div></div>';
  html += '<h2>Сброс прогресса</h2><input id="admResetName" placeholder="Имя ученика">' +
    '<input id="admResetCode" inputmode="numeric" maxlength="6" placeholder="Родительский код">' +
    '<div class="btn btn2" id="admReset">Сбросить прогресс ученика</div>' +
    '<div class="row"><div class="btn btn2" id="aBack2">← На главную</div></div>';
  var box = document.getElementById('s_admin');
  box.innerHTML = html;
  bindTap(document.getElementById('aBack'), function(){ show('s_prof'); });
  bindTap(document.getElementById('aBack2'), function(){ show('s_home'); });
  bindTap(document.getElementById('admAdd2'), function() {
    var c = document.getElementById('admCode2').value;
    var res = parseCode(c);
    if (!res) { toast('❌ Код не распознан или повреждён.'); return; }
    var board = load('ye_board', []);
    for (var i = 0; i < board.length; i++) if (board[i].code === c.trim()) { toast('Этот код уже внесён.'); return; }
    board.push({name:res.name, xp:res.xp, weeks:res.week, score:res.score, code:c.trim(), ts:Date.now()});
    save('ye_board', board);
    toast('🏆 ' + res.name + ' + в таблицу!');
    renderAdmin(curUser());
  });
  bindTap(document.getElementById('admReset'), function() {
    var nm = document.getElementById('admResetName').value.trim();
    var cc = document.getElementById('admResetCode').value.trim();
    if (cc !== PARENT) { toast('❌ Неверный родительский код.'); return; }
    for (var i = 0; i < USERS.length; i++) {
      if (USERS[i].name === nm && !USERS[i].admin) {
        USERS[i] = {name:nm, phone:USERS[i].phone, pin:USERS[i].pin, admin:false, xp:0, badges:[], weeks:new Array(12).fill(0), theory:new Array(12).fill(false), laws:new Array(8).fill(false), best:0, testsDone:0, calcUsed:false};
        mySave();
        toast('Прогресс ' + nm + ' сброшен.');
        renderAdmin(curUser());
        return;
      }
    }
    toast('Ученик с таким именем не найден на этом устройстве.');
  });
}

/* ================= ЗАПУСК ================= */
function buzz(ms) { try { if (window.WebApp && WebApp.haptic && typeof WebApp.haptic === 'function') WebApp.haptic(ms); } catch(e) {} }

renderCheat();
renderExp();
renderCalc();   // инициализация калькулятора — без неё экран «Считалка» был бы пустым

var CUR_SAVED = load('ye_cur', -1);
if (CUR_SAVED >= 0 && CUR_SAVED < USERS.length) {
  CUR = CUR_SAVED;
  document.getElementById('nav').classList.remove('hidden');
  renderCheat(); renderExp(); renderCalc();
  show('s_home'); render();
  toast('🔓 С возвращением, ' + curUser().name + '!');
} else {
  renderAuth(USERS.length === 0 ? 'reg' : 'login');
  show('s_auth');
}
