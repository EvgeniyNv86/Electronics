<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Картотека радиодеталей</title>
<style>
  :root{
    --bg:#15181d; --panel:#1e222a; --cell:#232833; --border:#3a4150;
    --ok:#4caf50; --accent:#ff9800; --text:#e8eaf0; --muted:#9aa3b0;
  }
  *{box-sizing:border-box}
  body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
       background:var(--bg);color:var(--text);margin:0;padding:16px}
  h1{text-align:center;font-size:22px;margin:8px 0 4px}
  .subtitle{text-align:center;color:var(--muted);font-size:13px;margin-bottom:12px}
  .controls{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  button{padding:8px 14px;border:none;border-radius:8px;cursor:pointer;font-weight:600;
         font-size:13px;transition:transform .15s,opacity .15s}
  button:hover{opacity:.9;transform:translateY(-1px)}
  .btn-primary{background:var(--accent);color:#1a1a1a}
  .btn-sec{background:#2a303c;color:var(--text);border:1px solid var(--border)}
  .btn-danger{background:#5a2a2a;color:#ffcccc}
  .btn-ok{background:#2d5a2f;color:#d8ffd8}
  .search-row{display:flex;flex-direction:column;align-items:center;gap:6px;margin:6px auto 18px}
  .search-wrap{display:flex;align-items:center;gap:6px;background:var(--cell);
    border:1.5px solid var(--border);border-radius:24px;padding:5px 8px 5px 16px;
    width:min(560px,94vw);transition:border-color .2s,box-shadow .2s}
  .search-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,152,0,.18)}
  .search-icon{font-size:15px;flex:none;opacity:.8}
  .search{flex:1;border:none;background:transparent;color:var(--text);font-size:15px;outline:none;min-width:0}
  .search::placeholder{color:var(--muted)}
  .clear-btn{border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:13px;
    padding:4px 7px;border-radius:50%;display:none;line-height:1}
  .clear-btn:hover{color:var(--text);background:#2a303c}
  .search-count{font-size:12px;color:var(--muted);min-height:15px;text-align:center}
  .search-count b{color:var(--accent)}
  .gear{width:42px;height:36px;padding:0;font-size:16px}
  .status{text-align:center;font-size:12px;color:var(--muted);min-height:16px;margin-bottom:14px}
  .status.ok{color:var(--ok)} .status.err{color:#ef5350}
  .banner{max-width:940px;margin:0 auto 14px;background:#33401f;border:1px solid #6a8a2a;
          color:#d8e8a8;border-radius:10px;padding:10px 14px;font-size:13px;display:none;
          justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .panel{background:var(--panel);border-radius:14px;padding:16px;margin:0 auto 22px;max-width:940px}
  .panel-wide{max-width:1180px}
  .panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .panel-title{color:var(--accent);font-weight:700;font-size:17px}
  .rename-btn{background:none;border:1px dashed var(--border);color:var(--muted);
              border-radius:6px;padding:4px 8px;font-size:12px;font-weight:400}
  .grid{display:grid;gap:8px}
  .g8{grid-template-columns:repeat(8,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g2{grid-template-columns:repeat(2,1fr)}
  @media(max-width:900px){.g8{grid-template-columns:repeat(4,1fr)}}
  @media(max-width:520px){.g8{grid-template-columns:repeat(3,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
  .cell{background:var(--cell);border:1px solid var(--border);border-radius:10px;
        padding:8px;cursor:pointer;min-height:58px;transition:border-color .2s,box-shadow .2s}
  .cell:hover{border-color:var(--accent);box-shadow:0 0 0 2px rgba(255,152,0,.55),0 4px 14px rgba(255,152,0,.25);transform:translateY(-2px)}
  .cell.filled{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
  .cell.dim{opacity:.25}
  .cell .code{font-size:10px;color:var(--muted);letter-spacing:.5px}
  .cell .row{display:flex;align-items:center;gap:6px;margin-top:4px}
  .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .cell .name{font-size:13px;line-height:1.25;word-break:break-word}
  .cell.pop{animation:pop .35s ease}
  @keyframes pop{0%{transform:scale(1)}45%{transform:translateY(-7px) scale(1.09)}100%{transform:scale(1)}}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}
  .overlay.show{opacity:1;pointer-events:auto}
  .modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.94);opacity:0;
         pointer-events:none;background:var(--panel);border:1px solid var(--border);border-radius:14px;
         padding:20px;width:min(460px,94vw);z-index:11;transition:transform .3s cubic-bezier(.2,1.4,.4,1),opacity .25s;
         box-shadow:0 18px 50px rgba(0,0,0,.5);max-height:88vh;overflow:auto}
  .modal.show{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
  .modal h3{margin:0 0 12px;font-size:16px;color:var(--accent)}
  .modal label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
  .modal input,.modal select,.modal textarea{width:100%;padding:8px 10px;border:1px solid var(--border);
        border-radius:8px;background:var(--cell);color:var(--text);font-size:14px;font-family:inherit}
  .modal textarea{resize:vertical;min-height:52px}
  .modal-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
  .pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .pill{background:#2a303c;border:1px solid var(--border);border-radius:20px;padding:5px 12px;
        font-size:12px;color:var(--text);cursor:pointer}
  .pill.sel{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
  .hint b{color:var(--text)}
  input[type=file]{display:none}
</style>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
<h1>📦 Картотека радиодеталей</h1>
<div class="subtitle">Клик по ящичку — записать содержимое. База: этот браузер + GitHub.</div>
<div class="controls">
  <button class="btn-primary" onclick="openAdd()">➕ Добавить деталь</button>
  <button class="btn-sec" onclick="pushToGithub()">⬆️ На GitHub</button>
  <button class="btn-sec" onclick="pullFromGithub()">⬇️ С GitHub</button>
  <button class="btn-sec" onclick="exportJSON()">⬇️ Экспорт JSON</button>
  <button class="btn-sec" onclick="document.getElementById('importFile').click()">⬆️ Импорт JSON</button>
  <button class="btn-sec" onclick="exportCSV()">📄 CSV</button>
  <button class="btn-sec" onclick="exportExcel()">📊 Excel</button>
  <button class="btn-sec gear" onclick="openSettings()" title="Настройки">⚙</button>
  <input type="file" id="importFile" accept=".json" onchange="importJSON(event)">
</div>
<div class="search-row">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input id="search" class="search" placeholder="Что ищем? Название, номинал, категория, код ящика…" autocomplete="off">
    <button class="clear-btn" id="clearSearch" onclick="clearSearch()" title="Очистить">✕</button>
  </div>
  <div class="search-count" id="searchCount"></div>
</div>
<div class="status" id="status"></div>
<div class="banner" id="banner">
  <span id="bannerText"></span>
  <span><button class="btn-ok" onclick="bannerLoad()">Загрузить</button>
  <button class="btn-sec" onclick="document.getElementById('banner').style.display='none'">Позже</button></span>
</div>
<div id="app"></div>

<div class="overlay" id="overlay" onclick="closeModal()"></div>
<div class="modal" id="modal">
  <h3 id="mTitle">Ящичек</h3>
  <label>Название / что лежит</label><input id="fName">
  <label>Категория</label><select id="fCat"></select>
  <label>Количество</label><input id="fQty" type="number" min="0">
  <label>Заметка</label><textarea id="fNote"></textarea>
  <div class="modal-actions">
    <button class="btn-primary" onclick="saveCell()">Сохранить</button>
    <button class="btn-sec" onclick="clearCell()">Очистить ящик</button>
    <button class="btn-sec" onclick="closeModal()">Закрыть</button>
  </div>
</div>

<div class="modal" id="addModal">
  <h3>➕ Добавить деталь</h3>
  <label>Название (например: IRF2804, 470 µF 16V, 104 керам, 1N4007)</label>
  <input id="aName" placeholder="название с маркировкой" oninput="renderAdd()">
  <label>Количество</label>
  <input id="aQty" type="number" min="0" value="1">
  <div class="hint" id="aHint"></div>
  <div class="pills" id="aPills"></div>
  <div class="modal-actions" id="aActions"></div>
  <button class="btn-sec" style="margin-top:8px" onclick="closeAdd()">Закрыть</button>
</div>

<div class="modal" id="setModal">
  <h3>⚙ Настройки</h3>
  <label>GitHub: имя пользователя</label><input id="sUser" placeholder="evgeniynv86">
  <label>GitHub: репозиторий</label><input id="sRepo" placeholder="Electronics">
  <label>Токен (Contents: Read and write; нужен только для записи)</label>
  <input id="sToken" type="password" placeholder="github_pat_…">
  <label><input type="checkbox" id="sAuto" style="width:auto;margin-right:6px">Автосохранение на GitHub при каждом изменении</label>
  <div class="modal-actions">
    <button class="btn-primary" onclick="saveSettings()">Сохранить</button>
    <button class="btn-sec" onclick="testGh()">Проверить связь</button>
    <button class="btn-danger" onclick="clearAll()">🗑 Очистить всё</button>
    <button class="btn-sec" onclick="closeSettings()">Закрыть</button>
  </div>
  <div class="hint">Токен хранится только в этом браузере и уходит только на api.github.com.
  Чтение базы работает и без токена — прямо с адреса GitHub Pages.</div>
</div>

<script>
const CATS = {
  'Резисторы':'#e57373','Конденсаторы':'#64b5f6','Диоды':'#81c784','Транзисторы':'#ba68c8',
  'Модули':'#ffb74d','Разъёмы':'#4dd0e1','Провода':'#a1887f','Крепёж':'#90a4ae','Прочее':'#f06292'
};
const SECTIONS = [
  {id:'A', title:'Органайзер DEKO A (верхний)', type:'deko', cols:8, rows:9},
  {id:'B', title:'Органайзер DEKO B (нижний)',  type:'deko', cols:8, rows:9},
  {id:'C', title:'Мини-шкафчик C — резисторы (левый, верх)', type:'mini', cols:3, rows:4},
  {id:'D', title:'Мини-шкафчик D — резисторы (левый, низ)',  type:'mini', cols:3, rows:4},
  {id:'E', title:'Мини-шкафчик E — резисторы (центр)',       type:'mini', cols:3, rows:4},
  {id:'F', title:'Мини-шкафчик F — резерв (справа)',         type:'mini', cols:3, rows:4},
  {id:'BAT', title:'Держатель батареек', type:'battery', cols:2, rows:1, labels:['AAA','AA']}
];
const DEFAULTS = {
  'C-0101':{n:'10K / 1K',c:'Резисторы'}, 'C-0102':{n:'1K',c:'Резисторы'},
  'C-0201':{n:'680 / 100K',c:'Резисторы'},'C-0202':{n:'220',c:'Резисторы'},
  'C-0301':{n:'510 / 51K',c:'Резисторы'}, 'C-0302':{n:'100',c:'Резисторы'},
  'C-0401':{n:'470 / 2.2K',c:'Резисторы'},'C-0402':{n:'330',c:'Резисторы'},
  'D-0101':{n:'470K / 47K',c:'Резисторы'},'D-0102':{n:'270',c:'Резисторы'},
  'D-0201':{n:'1M / 150',c:'Резисторы'},  'D-0202':{n:'4.7K',c:'Резисторы'},
  'D-0301':{n:'2K / 10',c:'Резисторы'},   'D-0302':{n:'220',c:'Резисторы'},
  'D-0401':{n:'22 / 69K',c:'Резисторы'},  'D-0402':{n:'47',c:'Резисторы'},
  'E-0101':{n:'200 / 10K',c:'Резисторы'}, 'E-0102':{n:'3.3K',c:'Резисторы'},
  'E-0201':{n:'9K / 300K',c:'Резисторы'}, 'E-0202':{n:'695K',c:'Резисторы'}
};

// ===== СЛОВАРЬ КЛАССИФИКАЦИИ — данные, легко дополнять =====
const RULES = [
  {cat:'Прочее',       cell:null,   re:/кварц|hc-?49/i},
  {cat:'Прочее',       cell:'A-24', re:/трансформатор|flyback|ee-?сердеч/i},
  {cat:'Прочее',       cell:'A-25', re:/дросс|индуктивн|мкгн|uh\b/i},
  {cat:'Прочее',       cell:'A-30', re:/варистор|zov|jy472/i},
  {cat:'Прочее',       cell:'A-31', re:/термистор|ntc/i},
  {cat:'Прочее',       cell:'A-08', re:/термопредохр|thermal cutoff/i},
  {cat:'Прочее',       cell:'A-17', re:/стабил|lm78|l78|7805|7812|7815|ldo|lt1587/i},
  {cat:'Прочее',       cell:'A-18', re:/lm324|к155|k155|74ls00|ла3|eeprom|24lc|93lc|fan7601|uc384/i},
  {cat:'Прочее',       cell:'A-19', re:/74hc595|сдвигов/i},
  {cat:'Прочее',       cell:'A-20', re:/ne555|555 таймер|таймер/i},
  {cat:'Прочее',       cell:'A-23', re:/tda|усилител/i},
  {cat:'Прочее',       cell:'A-32', re:/dc-?dc|lm2596|xl6009|buck|boost|понижа|повыша/i},
  {cat:'Прочее',       cell:'A-33', re:/g6b|реле g6b/i},
  {cat:'Прочее',       cell:'A-37', re:/релейн|реле модул|srd-?\d/i},
  {cat:'Прочее',       cell:'A-34', re:/esp32|esp8266/i},
  {cat:'Прочее',       cell:'A-35', re:/рокер|kcd|выключател/i},
  {cat:'Прочее',       cell:'A-36', re:/кнопк/i},
  {cat:'Прочее',       cell:'A-38', re:/вольтметр|амперметр/i},
  {cat:'Прочее',       cell:'A-39', re:/oled/i},
  {cat:'Прочее',       cell:'A-40', re:/семисегмент|7-?сегмент|сегмент/i},
  {cat:'Транзисторы',  cell:'A-11', re:/\birl/i},
  {cat:'Транзисторы',  cell:'A-14', re:/\birf\d|stp\d|aod?\d{2,4}f/i},
  {cat:'Транзисторы',  cell:'A-21', re:/ao44|aod44/i},
  {cat:'Транзисторы',  cell:'A-13', re:/tip\d|bd\d/i},
  {cat:'Транзисторы',  cell:'A-09', re:/2n2907|\bpnp\b/i},
  {cat:'Транзисторы',  cell:'A-10', re:/2n2222|\bnpn\b/i},
  {cat:'Транзисторы',  cell:'A-15', re:/кт9|kt9|2sc|2n\d|4n60|c1815|c945|транзистор/i},
  {cat:'Диоды',        cell:'A-06', re:/1n400\d|1n540\d|выпрямител/i},
  {cat:'Диоды',        cell:'A-07', re:/шоттки|1n58|mbr|ss\d\d|sr\d\d/i},
  {cat:'Диоды',        cell:'A-01', re:/rgb|светодиод|led/i},
  {cat:'Диоды',        cell:'A-05', re:/диод/i},
  {cat:'Конденсаторы', cell:'A-29', re:/x2|mkp|cbb|пл[её]н/i},
  {cat:'Конденсаторы', cell:'A-26', re:/электрол|al-el/i},
  {cat:'Конденсаторы', cell:'A-27', re:/высоковольт|y2|x1|mlcc/i},
  {cat:'Конденсаторы', cell:'A-28', re:/керам|ceramic|дисков/i}
];

const KEY='cartoteka_v1', GKEY='cartoteka_gh';
let state=JSON.parse(localStorage.getItem(KEY)||'null');
if(!state){ state={v:2,titles:{},cells:{},savedAt:null};
  for(const k in DEFAULTS) state.cells[k]=Object.assign({},DEFAULTS[k],{qty:'',note:''});
  save();
}
if(!state.v || state.v<2){
  const map={};
  for(const k in state.cells){
    const m=k.match(/^([AB])-(\d{2})$/);
    if(m){ const n=parseInt(m[2],10); if(n>=9&&n<=80) map[k]=m[1]+'-'+String(n-8).padStart(2,'0'); }
  }
  const nc={};
  for(const k in state.cells) nc[map[k]||k]=state.cells[k];
  state.cells=nc; state.v=2; save();
}
if(!state.titles) state.titles={};

function save(){ state.savedAt=new Date().toISOString(); localStorage.setItem(KEY,JSON.stringify(state)); schedulePush(); }
function ghCfg(){ try{ return JSON.parse(localStorage.getItem(GKEY)||'null')||{}; }catch(e){ return {}; } }
function pagesBase(){ const c=ghCfg();
  return (c.user&&c.repo)?'https://'+c.user.toLowerCase()+'.github.io/'+c.repo.replace(/^\/|\/$/g,'')+'/':null; }

function cellCode(sec,r,c){
  if(sec.type==='deko') return sec.id+'-'+String((r-1)*sec.cols+c).padStart(2,'0');
  if(sec.type==='mini') return sec.id+'-0'+r+'0'+c;
  return sec.labels[c-1];
}
function render(){
  const q=(document.getElementById('search').value||'').toLowerCase().trim();
  let matched=0, filledCount=0;
  const app=document.getElementById('app'); app.innerHTML='';
  for(const sec of SECTIONS){
    const title=(state.titles&&state.titles[sec.id])||sec.title;
    const p=document.createElement('div');
    p.className='panel'+(sec.type==='deko'?' panel-wide':'');
    p.innerHTML='<div class="panel-head"><div class="panel-title">'+title+
      '</div><button class="rename-btn" onclick="rename(\''+sec.id+'\')">✏ переименовать</button></div>';
    const g=document.createElement('div');
    g.className='grid '+(sec.cols===8?'g8':(sec.cols===3?'g3':'g2'));
    for(let r=1;r<=sec.rows;r++) for(let c=1;c<=sec.cols;c++){
      const code=cellCode(sec,r,c);
      const d=state.cells[code];
      const name=d?(d.n||''):'';
      const match=!q||((name+' '+(d&&d.note||'')+' '+(d&&d.c||'')+' '+code).toLowerCase().includes(q));
      if(match&&name) matched++;
      if(name) filledCount++;
      const el=document.createElement('div');
      el.className='cell'+(name?' filled':'')+((q&&!match)?' dim':'');
      if(name) el.title=name;
      el.innerHTML='<div class="code">'+code+'</div><div class="row">'+
        (name?'<span class="dot" style="background:'+(CATS[d.c]||'#f06292')+'"></span>':'')+
        '<span class="name">'+(name||'')+'</span></div>';
      el.onclick=()=>{ el.classList.add('pop'); setTimeout(()=>openModal(sec,code),260); };
      g.appendChild(el);
    }
    p.appendChild(g); app.appendChild(p);
  }
  const cb=document.getElementById('clearSearch');
  if(cb) cb.style.display=q?'inline-block':'none';
  const sc=document.getElementById('searchCount');
  if(sc){
    if(q){
      const qv=document.getElementById('search').value.trim();
      sc.innerHTML='По запросу «'+qv+'»: найдено <b>'+matched+'</b> '+pluralRu(matched,['ящик','ящика','ящиков']);
    } else {
      sc.innerHTML=filledCount
        ? 'В картотеке: <b>'+filledCount+'</b> '+pluralRu(filledCount,['запись','записи','записей'])+' · нажмите <b>«/»</b>, чтобы искать'
        : '';
    }
  }
}
function pluralRu(n,forms){
  const n10=n%10,n100=n%100;
  if(n100>=11&&n100<=14) return forms[2];
  if(n10===1) return forms[0];
  if(n10>=2&&n10<=4) return forms[1];
  return forms[2];
}
function clearSearch(){
  const s=document.getElementById('search');
  s.value=''; render(); s.focus();
}
function openModal(sec,code){
  current={sec,code};
  const d=state.cells[code]||{};
  document.getElementById('mTitle').textContent=code+' — '+((state.titles&&state.titles[sec.id])||sec.title);
  document.getElementById('fName').value=d.n||'';
  document.getElementById('fCat').value=d.c||'Прочее';
  document.getElementById('fQty').value=d.qty||'';
  document.getElementById('fNote').value=d.note||'';
  document.getElementById('overlay').classList.add('show');
  document.getElementById('modal').classList.add('show');
}
function closeModal(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('modal').classList.remove('show');
  document.getElementById('addModal').classList.remove('show');
  document.getElementById('setModal').classList.remove('show');
}
function saveCell(){
  const n=document.getElementById('fName').value.trim();
  if(n) state.cells[current.code]={n:n,c:document.getElementById('fCat').value,
    qty:document.getElementById('fQty').value,note:document.getElementById('fNote').value.trim()};
  else delete state.cells[current.code];
  save(); render(); closeModal();
}
function clearCell(){ delete state.cells[current.code]; save(); render(); closeModal(); }
function rename(id){
  const sec=SECTIONS.find(s=>s.id===id);

// ===== УМНОЕ ДОБАВЛЕНИЕ =====
function parseVal(tok){
  const m=String(tok).trim().match(/^([\d.,]+)\s*([kкmм])?\s*(ом|Ω|r)?$/i);
  if(!m) return null;
  let v=parseFloat(m[1].replace(',','.'));
  if(isNaN(v)) return null;
  const suf=(m[2]||'').toLowerCase();
  if(suf==='k'||suf==='к') v*=1000;
  if(suf==='m'||suf==='м') v*=1000000;
  return Math.round(v);
}
function resTokens(name){
  return String(name).split(/[/,]+/).map(t=>parseVal(t)).filter(v=>v!==null);
}
function scanResistors(ohms){
  const out=[];
  for(const sec of SECTIONS){
    if(sec.type!=='mini') continue;
    for(let r=1;r<=sec.rows;r++) for(let c=1;c<=sec.cols;c++){
      const code=cellCode(sec,r,c), d=state.cells[code];
      if(!d) continue;
      if(resTokens(d.n).includes(ohms)) out.push({code,label:code+' — '+d.n});
    }
  }
  return out;
}
function findFreeCell(){
  for(const id of ['A','B'])
    for(let i=41;i<=72;i++){ const c=id+'-'+String(i).padStart(2,'0');
      if(!state.cells[c]||!state.cells[c].n) return c; }
  for(let i=1;i<=72;i++){ const c='B-'+String(i).padStart(2,'0');
    if(!state.cells[c]||!state.cells[c].n) return c; }
  return null;
}
function similarCells(name){
  const toks=normTokens(name);
  if(!toks.length) return [];
  const out=[];
  for(const k in state.cells){
    const d=state.cells[k]; if(!d||!d.n) continue;
    const ct=normTokens(d.n);
    if(ct.some(t=>toks.includes(t))) out.push({code:k,label:k+' — '+d.n});
  }
  return out.slice(0,6);
}
function normTokens(s){
  return String(s).toLowerCase().replace(/[^a-zа-яё0-9.,µмк]+/gi,' ').split(/\s+/)
    .filter(t=>t&&!['шт','в','для','с','и','на'].includes(t));
}
function classify(name){
  const n=name.toLowerCase().trim();
  // резистор: есть единица сопротивления или одиночное число без ёмкостных слов
  if(/(ом|Ω|ohm|k\b|к\b|kΩ|кΩ)/i.test(n) || /^\s*[\d.,]+\s*[kкmм]?\s*(ом|Ω|r)?\s*$/i.test(n)){
    const vals=resTokens(n);
    if(vals.length){
      const hits=[];
      for(const v of vals) hits.push(...scanResistors(v));
      if(hits.length) return {cat:'Резисторы',cell:hits[0].code,alts:hits,
        why:'Резистор '+n+': совпадение в ящиках резисторов'};
      const free=findFreeCell();
      return {cat:'Резисторы',cell:free||'F-0101',why:'Новый номинал резистора — свободный ящик'};
    }
  }
  for(const r of RULES){
    if(r.re.test(n)) return {cat:r.cat,cell:r.cell||findFreeCell(),alts:null,
      why:'Правило: '+(r.cell||'новая ячейка')};
  }
  // 3-значный код без слов — вероятно керамика, предупредим
  const code=n.match(/^\s*(\d{1,4})\s*$/);
  if(code) return {cat:'Конденсаторы',cell:'A-28',
    why:'Похоже на код керамики ('+code[1]+'). Если это резистор — выберите ящик из C/D/E вручную'};
  return {cat:'Прочее',cell:findFreeCell(),why:'Не распознал — свободная ячейка'};
}
let addCell=null, addAlts=[];
function openAdd(){
  document.getElementById('overlay').classList.add('show');
  document.getElementById('addModal').classList.add('show');
  document.getElementById('aName').value='';
  document.getElementById('aQty').value='1';
  renderAdd();
}
function closeAdd(){ closeModal(); }
function renderAdd(){
  const name=document.getElementById('aName').value.trim();
  const pills=document.getElementById('aPills'), act=document.getElementById('aActions');
  const hint=document.getElementById('aHint');
  pills.innerHTML=''; act.innerHTML=''; addCell=null; addAlts=[];
  if(!name){ hint.textContent='Введите название — я сам определю категорию и предложу ящик.';
    return; }
  const cl=classify(name);
  const d=cl.cell?state.cells[cl.cell]:null;
  hint.innerHTML='Категория: <b>'+cl.cat+'</b>. '+cl.why+(d?'<br>В ящике сейчас: <b>'+d.n+'</b>':'');
  const mk=(cell,label,sel)=>{ const b=document.createElement('button');
    b.className='pill'+(sel?' sel':''); b.textContent=label;
    b.onclick=()=>{ addCell=cell; renderAdd(true); }; pills.appendChild(b); };
  if(cl.cell){ addCell=cl.cell; mk(cl.cell,'→ '+cl.cell, true); }
  (cl.alts||[]).forEach(a=>{ if(a.code!==cl.cell) mk(a.code,'или '+a.label); });
  similarCells(name).forEach(s=>{ if(s.code!==cl.cell) mk(s.code,'или '+s.label); });
  // строки действий
  const q=document.getElementById('aQty').value||'1';
  const same=d && normTokens(d.n)[0]===normTokens(name)[0] && normTokens(d.n).length===normTokens(name).length;
  const addBtn=(txt,cls,fn)=>{ const b=document.createElement('button'); b.className=cls;
    b.textContent=txt; b.onclick=fn; act.appendChild(b); };
  if(addCell){
    if(!d){ addBtn('Записать в '+addCell,'btn-primary',()=>commitAdd(name,q,'new')); }
    else if(same){ addBtn('Записать в '+addCell+' (добавить к лежащему)','btn-primary',()=>commitAdd(name,q,'merge')); }
    else{
      addBtn('Дописать к '+addCell,'btn-primary',()=>commitAdd(name,q,'append'));
      addBtn('Заменить содержимое','btn-danger',()=>commitAdd(name,q,'replace'));
    }
  }
}
function commitAdd(name,q,mode){
  const today=new Date().toLocaleDateString('ru-RU');
  const d=state.cells[addCell];
  if(mode==='new'){ state.cells[addCell]={n:name,c:lastCat(),qty:q,note:'доб. '+today}; }
  else if(mode==='merge'){
    d.qty=(parseInt(d.qty||'0',10)+parseInt(q||'0',10))||q;
    d.note=(d.note?d.note+'\n':'')+'+ '+today+': '+name+' ×'+q;
  }
  else if(mode==='append'){
    d.note=(d.note?d.note+'\n':'')+'+ '+today+': '+name+' ×'+q+' (категория: '+lastCat()+')';
  }
  else if(mode==='replace'){
    state.cells[addCell]={n:name,c:lastCat(),qty:q,note:'замена '+today+'. Было: '+d.n};
  }
  save(); render(); closeAdd();
  status('Записано в '+addCell+': '+name,true);
}
function lastCat(){
  const n=document.getElementById('aName').value.trim();
  return classify(n).cat;
}

// ===== GITHUB =====
let pushTimer=null;
function schedulePush(){ const c=ghCfg(); if(c.token&&c.user&&c.repo&&c.auto){
  clearTimeout(pushTimer); pushTimer=setTimeout(pushToGithub,3000); } }
function status(msg,ok,err){ const s=document.getElementById('status');
  s.textContent=msg; s.className='status '+(err?'err':(ok?'ok':'')); }
async function pushToGithub(){
  const c=ghCfg();
  if(!c.user||!c.repo||!c.token){ openSettings(); status('Заполните настройки GitHub',false,true); return; }
  status('⬆️ Сохраняю на GitHub…');
  save();
  const body={message:'Картотека: обновление '+new Date().toLocaleString('ru-RU'),
    content:btoa(unescape(encodeURIComponent(JSON.stringify(state,null,2))))};
  try{
    let sha=null;
    const r0=await fetch('https://api.github.com/repos/'+c.user+'/'+c.repo+'/contents/cartoteka.json',
      {headers:{Authorization:'Bearer '+c.token}});
    if(r0.ok){ const j=await r0.json(); sha=j.sha; }
    const r=await fetch('https://api.github.com/repos/'+c.user+'/'+c.repo+'/contents/cartoteka.json',
      {method:'PUT',headers:{Authorization:'Bearer '+c.token,'Content-Type':'application/json'},
       body:JSON.stringify(Object.assign({sha},body))});
    if(r.ok){ status('✅ Сохранено на GitHub',true); }
    else{ const e=await r.json().catch(()=>({}));
      status('Ошибка GitHub: '+(e.message||r.status),false,true); }
  }catch(e){ status('Ошибка сети: '+e,false,true); }
}
async function fetchRemote(){
  const c=ghCfg();
  const base=pagesBase();
  if(base){
    try{
      const r=await fetch(base+'cartoteka.json?t='+Date.now());
      if(r.ok){ const j=await r.json(); if(j&&j.cells) return {data:j,src:'pages'}; }
    }catch(e){}
  }
  if(c.user&&c.repo&&c.token){
    try{
      const r=await fetch('https://api.github.com/repos/'+c.user+'/'+c.repo+'/contents/cartoteka.json',
        {headers:{Authorization:'Bearer '+c.token}});
      if(r.ok){ const j=await r.json();
        const data=JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\s/g,'')))));
        return {data,src:'api'}; }
    }catch(e){}
  }
  return null;
}
async function applyRemote(){
  const res=await fetchRemote();
  if(!res){ status('База на GitHub недоступна (нет файла или токена)',false,true); return; }
  const rem=res.data;
  if(!confirm('Заменить текущую картотеку базой с GitHub'+(res.src==='pages'?' (Pages, без токена)':'')+'?')) return;
  state=rem; if(!state.titles) state.titles={};
  localStorage.setItem(KEY,JSON.stringify(state)); render();
  status('✅ Загружено с GitHub ('+(res.src==='pages'?'Pages':'API')+')',true);
}
function pullFromGithub(){ applyRemote(); }
function openSettings(){
  const c=ghCfg();
  document.getElementById('sUser').value=c.user||'';
  document.getElementById('sRepo').value=c.repo||'';
  document.getElementById('sToken').value=c.token||'';
  document.getElementById('sAuto').checked=!!c.auto;
  document.getElementById('overlay').classList.add('show');
  document.getElementById('setModal').classList.add('show');
}
function closeSettings(){ closeModal(); }
function saveSettings(){
  localStorage.setItem(GKEY,JSON.stringify({
    user:document.getElementById('sUser').value.trim(),
    repo:document.getElementById('sRepo').value.trim(),
    token:document.getElementById('sToken').value.trim(),
    auto:document.getElementById('sAuto').checked
  }));
  closeSettings(); status('Настройки сохранены',true);
}
async function testGh(){
  saveSettings();
  const c=ghCfg();
  if(!c.user||!c.repo){ status('Заполните пользователя и репозиторий',false,true); return; }
  status('Проверяю…');
  const base=pagesBase();
  if(base){ try{ const r=await fetch(base+'cartoteka.json?t='+Date.now());
    if(r.ok){ status('✅ Чтение по Pages работает: '+base,false,true); return; } }catch(e){} }
  if(c.token){ try{
    const r=await fetch('https://api.github.com/repos/'+c.user+'/'+c.repo,{headers:{Authorization:'Bearer '+c.token}});
    status(r.ok?'✅ Токен и репозиторий в порядке':'Ошибка токена/репозитория: '+r.status,r.ok,!r.ok);
    return;
  }catch(e){ status('Ошибка сети',false,true); return; } }
  status('Pages не отвечает, токен не задан. Проверьте адрес.',false,true);
}

// ===== ЭКСПОРТ/ИМПОРТ =====
function exportJSON(){
  save();
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='cartoteka.json'; a.click();
}
function importJSON(ev){
  const f=ev.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{
      const s=JSON.parse(rd.result);
      if(s&&s.cells){
        state=s; if(!state.titles) state.titles={};
        if(!state.v||state.v<2){
          const map={};
          for(const k in state.cells){
            const m=k.match(/^([AB])-(\d{2})$/);
            if(m){ const n=parseInt(m[2],10); if(n>=9&&n<=80) map[k]=m[1]+'-'+String(n-8).padStart(2,'0'); }
          }
          const nc={};
          for(const k in state.cells) nc[map[k]||k]=state.cells[k];
          state.cells=nc;
        }
        state.v=2; localStorage.setItem(KEY,JSON.stringify(state)); render();
        status('Импортировано: '+Object.keys(state.cells).length+' записей',true);
      }
    }catch(e){ status('Не удалось прочитать файл: '+e,false,true); } };
  rd.readAsText(f); ev.target.value='';
}
function exportCSV(){
  const rows=[['Ящик','Секция','Название','Категория','Кол-во','Заметка']];
  for(const sec of SECTIONS){ const title=(state.titles&&state.titles[sec.id])||sec.title;
    for(let r=1;r<=sec.rows;r++) for(let c=1;c<=sec.cols;c++){
      const code=cellCode(sec,r,c), d=state.cells[code];
      if(d) rows.push([code,title,d.n,d.c||'',d.qty||'',d.note||'']);
    } }
  const csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'}); const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='cartoteka.csv'; a.click();
}
function exportExcel(){
  if(typeof XLSX==='undefined'){ status('Библиотека Excel не загрузилась — при первом открытии нужен интернет',false,true); return; }
  save();
  const wb=XLSX.utils.book_new();

  // Лист 1: полная картотека
  const rows=[['Ящик','Секция','Название','Категория','Кол-во','Заметка']];
  const bySec={}, byCat={};
  let total=0, totalQty=0;
  for(const sec of SECTIONS){
    const title=(state.titles&&state.titles[sec.id])||sec.title;
    bySec[title]=0;
    for(let r=1;r<=sec.rows;r++) for(let c=1;c<=sec.cols;c++){
      const code=cellCode(sec,r,c), d=state.cells[code];
      if(!d) continue;
      const q=parseInt(d.qty,10)||0;
      rows.push([code,title,d.n,d.c||'Прочее',q||'',d.note||'']);
      bySec[title]++;
      byCat[d.c||'Прочее']=(byCat[d.c||'Прочее']||0)+1;
      total++; totalQty+=q;
    }
  }
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:9},{wch:38},{wch:40},{wch:16},{wch:9},{wch:80}];
  ws['!autofilter']={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:rows.length-1,c:5}})};
  XLSX.utils.book_append_sheet(wb,ws,'Картотека');

  // Лист 2: сводка
  const now=new Date();
  const pad=n=>String(n).padStart(2,'0');
  const sum=[
    ['📦 Картотека радиодеталей',''],
    ['Дата выгрузки',now.toLocaleString('ru-RU')],
    [''],
    ['Показатель','Значение'],
    ['Записей (непустых ящиков)',total],
    ['Всего штук (сумма количеств)',totalQty||'—'],
    [''],
    ['По секциям','Записей']
  ];
  for(const k in bySec) sum.push([k,bySec[k]||'—']);
  sum.push([''],['По категориям','Записей']);
  for(const k in byCat) sum.push([k,byCat[k]]);
  const ws2=XLSX.utils.aoa_to_sheet(sum);
  ws2['!cols']=[{wch:38},{wch:14}];
  ws2['!merges']=[{s:{r:0,c:0},e:{r:0,c:1}}];
  XLSX.utils.book_append_sheet(wb,ws2,'Сводка');

  XLSX.writeFile(wb,'cartoteka_'+now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate())+'.xlsx');
  status('✅ Excel выгружен: листы «Картотека» и «Сводка»',true);
}
function clearAll(){
  if(!confirm('Удалить ВСЕ записи? Сначала экспортируйте резерв!')) return;
  if(prompt('Для подтверждения введите слово УДАЛИТЬ:')!=='УДАЛИТЬ') return;
  state={v:2,titles:{},cells:{},savedAt:null};
  for(const k in DEFAULTS) state.cells[k]=Object.assign({},DEFAULTS[k],{qty:'',note:''});
  save(); render(); closeSettings(); status('Все записи удалены',true);
}
