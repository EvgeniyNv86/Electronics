<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Картотека радиодеталей</title>
<style>
  :root{
    --bg:#15181d; --panel:#1e222a; --cell:#232833; --border:#3a4150;
    --ok:#4caf50; --accent:#ff9800; --text:#e8eaf0; --muted:#9aa3b0;
  }
  *{box-sizing:border-box}
  body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
       background:var(--bg);color:var(--text);margin:0;padding:16px}
  h1{text-align:center;font-size:22px;margin:8px 0 4px}
  .subtitle{text-align:center;color:var(--muted);font-size:13px;margin-bottom:16px}
  .controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
  button{padding:8px 14px;border:none;border-radius:8px;cursor:pointer;font-weight:600;
         font-size:13px;transition:transform .15s,opacity .15s}
  button:hover{opacity:.9;transform:translateY(-1px)}
  .btn-primary{background:var(--accent);color:#1a1a1a}
  .btn-sec{background:#2a303c;color:var(--text);border:1px solid var(--border)}
  .btn-danger{background:#5a2a2a;color:#ffcccc}
  #gearBtn{padding:8px 13px;font-size:15px}
  input[type=file]{display:none}
  .search{padding:9px 14px;border:1px solid var(--border);border-radius:8px;
          background:var(--cell);color:var(--text);width:min(320px,90vw);font-size:14px}
  #ghStatus{min-height:18px;text-align:center;font-size:12px;color:var(--muted);margin-bottom:10px}
  .panel{background:var(--panel);border-radius:14px;padding:16px;margin:0 auto 22px;max-width:940px}
  .panel-wide{max-width:1180px}
  .panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .panel-title{color:var(--accent);font-weight:700;font-size:17px}
  .rename-btn{background:none;border:1px dashed var(--border);color:var(--muted);
              border-radius:6px;padding:4px 8px;font-size:12px;font-weight:400}
  .grid{display:grid;gap:8px}
  .g8{grid-template-columns:repeat(8,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g2{grid-template-columns:repeat(2,1fr)}
  .cell{background:var(--cell);border:1px solid var(--border);border-radius:10px;
        padding:8px;cursor:pointer;min-height:58px;transition:border-color .2s,box-shadow .2s}
  .cell:hover,.cell.filled:hover,.cell:hover.dim{border-color:var(--accent);box-shadow:0 0 0 2px rgba(255,152,0,.55),0 4px 14px rgba(255,152,0,.25);transform:translateY(-2px)}
  .cell.filled{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
  .cell.dim{opacity:.25}
  .cell .code{font-size:10px;color:var(--muted);letter-spacing:.5px}
  .cell .row{display:flex;align-items:center;gap:6px;margin-top:4px}
  .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .cell .name{font-size:13px;line-height:1.25;word-break:break-word}
  .cell.pop{animation:pop .35s ease}
  @keyframes pop{0%{transform:scale(1)}45%{transform:translateY(-7px) scale(1.09)}100%{transform:scale(1)}}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}
  .overlay.show{opacity:1;pointer-events:auto}
  .modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.94);opacity:0;
         pointer-events:none;background:var(--panel);border:1px solid var(--border);border-radius:14px;
         padding:20px;width:min(460px,92vw);z-index:11;transition:transform .3s cubic-bezier(.2,1.4,.4,1),opacity .25s;
         box-shadow:0 18px 50px rgba(0,0,0,.5);max-height:90vh;overflow:auto}
  .modal.show{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
  .modal h3{margin:0 0 12px;font-size:16px;color:var(--accent)}
  .modal label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
  .modal input,.modal select,.modal textarea{width:100%;padding:8px 10px;border:1px solid var(--border);
        border-radius:8px;background:var(--cell);color:var(--text);font-size:14px;font-family:inherit}
  .modal textarea{resize:vertical;min-height:52px}
  .modal-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
  .msg{text-align:center;color:var(--muted);font-size:12px;margin-top:6px}
  .aInfo{background:#2a303c;border:1px solid var(--border);border-radius:8px;
         padding:8px 10px;font-size:12px;margin-top:10px;color:var(--muted)}
  .aInfo.warn{color:#ffb3b3;border-color:#5a2a2a}
  .hr{border:none;border-top:1px solid var(--border);margin:16px 0 8px}
  .danger-row{display:flex;gap:8px}
  .danger-row input{flex:1}
  .check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);margin-top:10px}
  .check input{width:auto}
</style>
</head>
<body>
<h1>📦 Картотека радиодеталей</h1>
<div class="subtitle">Клик по ящичку — записать содержимое. Данные: браузер + синхронизация с GitHub.</div>
<div class="controls">
  <input id="search" class="search" placeholder="🔍 Поиск: резистор, 10K, модуль…">
  <button class="btn-primary" onclick="openAdd()">➕ Добавить деталь</button>
  <button class="btn-primary" onclick="ghPush(false)">⬆️ На GitHub</button>
  <button class="btn-sec" onclick="ghPull()">⬇️ С GitHub</button>
  <button class="btn-sec" onclick="exportJSON()">⬇️ Файл JSON</button>
  <button class="btn-sec" onclick="document.getElementById('importFile').click()">⬆️ Импорт JSON</button>
  <button class="btn-sec" id="gearBtn" title="Настройки" onclick="openSettings()">⚙</button>
  <input type="file" id="importFile" accept=".json" onchange="importJSON(event)">
</div>
<div id="ghStatus"></div>
<div id="app"></div>

<div class="overlay" id="overlay" onclick="closeAll()"></div>

<div class="modal" id="modal">
  <h3 id="mTitle">Ящичек</h3>
  <label>Название / что лежит</label><input id="fName">
  <label>Категория</label><select id="fCat"></select>
  <label>Количество</label><input id="fQty" type="number" min="0">
  <label>Заметка</label><textarea id="fNote"></textarea>
  <div class="modal-actions">
    <button class="btn-primary" onclick="saveCell()">Сохранить</button>
    <button class="btn-sec" onclick="clearCell()">Очистить ящик</button>
    <button class="btn-sec" onclick="closeAll()">Закрыть</button>
  </div>
</div>

<div class="modal" id="modalAdd">
  <h3>➕ Добавить деталь</h3>
  <label>Название / маркировка</label>
  <input id="aName" placeholder="например: 104 керам или IRLZ44N" oninput="suggest()">
  <label>Категория</label>
  <select id="aCat" onchange="aCatTouched=true"></select>
  <label>Ящик (код, например A-45)</label>
  <input id="aCell" list="cellList" oninput="aCellTouched=true;showCellInfo()" placeholder="A-41">
  <datalist id="cellList"></datalist>
  <div class="aInfo" id="aInfo" style="display:none"></div>
  <label>Количество</label><input id="aQty" type="number" min="0">
  <label>Заметка</label><textarea id="aNote"></textarea>
  <div class="modal-actions">
    <button class="btn-primary" onclick="saveAdd(false)">Сохранить</button>
    <button class="btn-sec" id="aMergeBtn" onclick="saveAdd(true)" style="display:none">Дописать к ящику</button>
    <button class="btn-sec" onclick="closeAll()">Закрыть</button>
  </div>
</div>

<div class="modal" id="modalSet">
  <h3>⚙ Настройки</h3>
  <label>GitHub: пользователь</label><input id="sUser" placeholder="username">
  <label>Репозиторий</label><input id="sRepo" placeholder="cartoteka">
  <label>Токен (fine-grained, право Contents: Read and write)</label><input id="sToken" type="password" placeholder="github_pat_…">
  <div class="check"><input type="checkbox" id="sAuto"> Автосохранение на GitHub при каждом изменении</div>
  <div class="msg" id="setMsg"></div>
  <div class="modal-actions">
    <button class="btn-primary" onclick="saveSettings()">Сохранить</button>
    <button class="btn-sec" onclick="closeAll()">Закрыть</button>
  </div>
  <hr class="hr">
  <label style="color:#ff9c9c">Опасная зона: введите слово УДАЛИТЬ, чтобы очистить всю картотеку</label>
  <div class="danger-row">
    <input id="sConfirm" placeholder="УДАЛИТЬ">
    <button class="btn-danger" onclick="dangerClear()">🗑</button>
  </div>
</div>

<script>
const CATS = {
  'Резисторы':'#e57373','Конденсаторы':'#64b5f6','Диоды':'#81c784','Транзисторы':'#ba68c8',
  'Модули':'#ffb74d','Разъёмы':'#4dd0e1','Провода':'#a1887f','Крепёж':'#90a4ae','Прочее':'#f06292'
};
const SECTIONS = [
  {id:'A', title:'Органайзер DEKO A (верхний)', type:'deko', cols:8, rows:9},
  {id:'B', title:'Органайзер DEKO B (нижний)',  type:'deko', cols:8, rows:9},
  {id:'C', title:'Мини-шкафчик C — резисторы (левый, верх)', type:'mini', cols:3, rows:4},
  {id:'D', title:'Мини-шкафчик D — резисторы (левый, низ)',  type:'mini', cols:3, rows:4},
  {id:'E', title:'Мини-шкафчик E — резисторы (центр)',       type:'mini', cols:3, rows:4},
  {id:'F', title:'Мини-шкафчик F — резерв (справа)',         type:'mini', cols:3, rows:4},
  {id:'BAT', title:'Держатель батареек', type:'battery', cols:2, rows:1, labels:['AAA','AA']}
];
const DEFAULTS = {
  'C-0101':{n:'10K / 1K',c:'Резисторы'}, 'C-0102':{n:'1K',c:'Резисторы'},
  'C-0201':{n:'680 / 100K',c:'Резисторы'},'C-0202':{n:'220',c:'Резисторы'},
  'C-0301':{n:'510 / 51K',c:'Резисторы'}, 'C-0302':{n:'100',c:'Резисторы'},
  'C-0401':{n:'470 / 2.2K',c:'Резисторы'},'C-0402':{n:'330',c:'Резисторы'},
  'D-0101':{n:'470K / 47K',c:'Резисторы'},'D-0102':{n:'270',c:'Резисторы'},
  'D-0201':{n:'1M / 150',c:'Резисторы'},  'D-0202':{n:'4.7K',c:'Резисторы'},
  'D-0301':{n:'2K / 10',c:'Резисторы'},   'D-0302':{n:'220',c:'Резисторы'},
  'D-0401':{n:'22 / 69K',c:'Резисторы'},  'D-0402':{n:'47',c:'Резисторы'},
  'E-0101':{n:'200 / 10K',c:'Резисторы'}, 'E-0102':{n:'3.3K',c:'Резисторы'},
  'E-0201':{n:'9K / 300K',c:'Резисторы'}, 'E-0202':{n:'695K',c:'Резисторы'}
};
// Правила умной классификации: порядок важен — сверху самые конкретные.
// Новое правило = дописать строку {cell:'A-XX', cat:'…', re:/…/i}.
const CLASS_RULES = [
  // Конденсаторы
  {cell:'A-29', cat:'Конденсаторы', re:/x2|mkp|cbb|пл[её]ноч/i},
  {cell:'A-26', cat:'Конденсаторы', re:/электрол|тантал|\sмкф|\bмкф|µf|uf\b/i},
  {cell:'A-27', cat:'Конденсаторы', re:/высоковоль|кв\b|kv\b|y5v|вв\b/i},
  {cell:'A-28', cat:'Конденсаторы', re:/пф|pf\b|нф|nf\b|керам/i},
  // Диоды и светодиоды
  {cell:'A-04', cat:'Диоды', re:/светодиод\w*\s+smd|smd\s+светодиод|2835|3528|5050|5730/i},
  {cell:'A-03', cat:'Диоды', re:/светодиод\w*.*1\s?w|1\s?w\s+led|мощн\w*\s+светодиод/i},
  {cell:'A-01', cat:'Диоды', re:/светодиод\w*\s+rgb|rgb\s+светодиод/i},
  {cell:'A-02', cat:'Диоды', re:/бел/i},
  {cell:'A-05', cat:'Диоды', re:/светодиод/i},
  {cell:'A-07', cat:'Диоды', re:/1n58|in58|ss3[46]|ss1[46]|sr3\d\d/i},
  {cell:'A-16', cat:'Диоды', re:/mbr|шоттк/i},
  {cell:'A-06', cat:'Диоды', re:/1n400[0-7]|выпрямител/i},
  {cell:'A-06', cat:'Диоды', re:/\b1n\d{3,4}\b|диод/i},
  // Транзисторы
  {cell:'A-09', cat:'Транзисторы', re:/2n2907|\bpnp\b/i},
  {cell:'A-11', cat:'Транзисторы', re:/irl\d|logic.?level|логич.*затвор/i},
  {cell:'A-12', cat:'Транзисторы', re:/irf540/i},
  {cell:'A-13', cat:'Транзисторы', re:/tip3[12]/i},
  {cell:'A-14', cat:'Транзисторы', re:/irf3205|stp\d+|mosfet|мощ/i},
  {cell:'A-21', cat:'Транзисторы', re:/ao4435|aod443|p.?mos/i},
  {cell:'A-10', cat:'Транзисторы', re:/2n2222|9013|9014|npn/i},
  {cell:'A-15', cat:'Транзисторы', re:/транзистор|кт972|kt972|2n390[46]|c1815|c945|bc\d{3}|aod\d+/i},
  // Индуктивности и трансформаторы
  {cell:'A-24', cat:'Прочее', re:/трансформатор|flyback|ee-?сердеч/i},
  {cell:'A-25', cat:'Прочее', re:/дроссель|индуктив|мкгн|uh\b|µh|тороид/i},
  // Микросхемы и прочая логика
  {cell:'A-19', cat:'Прочее', re:/74hc59[57]|74hc164|сдвиг/i},
  {cell:'A-20', cat:'Прочее', re:/\b555\b|таймер/i},
  {cell:'A-17', cat:'Прочее', re:/78\d\d|lm317|стабилизат|стабилитрон|ldo|zener/i},
  {cell:'A-18', cat:'Прочее', re:/lm\d{3}|74hc|74ls|cd40\d\d|24lc|93lc|93c\d\d|eeprom|оптопар|pc817|tl431|attiny|atmega|микросх|компарат|adc|da\s?adc/i},
  {cell:'A-23', cat:'Прочее', re:/tda\d+|усилител/i},
  // Пассивные «защитники»
  {cell:'A-30', cat:'Прочее', re:/варистор|zov|jy47|mov\b/i},
  {cell:'A-31', cat:'Прочее', re:/ntc|термистор|терморезист/i},
  {cell:'A-08', cat:'Прочее', re:/термо?предохр|thermal.?cutoff|aupo/i},
  // Модули и узлы
  {cell:'A-34', cat:'Модули', re:/esp32|esp8266|wroom|s3/i},
  {cell:'A-37', cat:'Прочее', re:/релейн\w* модул|songle|srd-|реле.*модул/i},
  {cell:'A-33', cat:'Прочее', re:/реле|g6b/i},
  {cell:'A-32', cat:'Прочее', re:/lm2596|xl6009|dc.?dc|понижающ|повышающ|buck|boost/i},
  {cell:'A-38', cat:'Прочее', re:/вольтметр|амперметр/i},
  {cell:'A-39', cat:'Прочее', re:/oled|ssd13|128x64/i},
  {cell:'A-40', cat:'Прочее', re:/сегмент|05611|5611|индикатор/i},
  {cell:'A-22', cat:'Прочее', re:/кварц|crystal|мгц|mhz/i},
  // Коммутация
  {cell:'A-35', cat:'Прочее', re:/kcd|рокер|выключател|тумблер|switch/i},
  {cell:'A-36', cat:'Прочее', re:/кнопк|грибок/i},
  // Резисторы — в мини-шкафчики C/D/E (по умолчанию первый свободный)
  {cell:'', cat:'Резисторы', re:/резистор|\bом\b|ком\b|мком|k\b/i}
];
const KEY='cartoteka_v1', GHKEY='cartoteka_gh';
let state=JSON.parse(localStorage.getItem(KEY)||'null');
if(!state){ state={v:2,titles:{},cells:{}};
  for(const k in DEFAULTS) state.cells[k]=Object.assign({},DEFAULTS[k],{qty:'',note:''});
  save();
}
if(!state.v || state.v<2) state=migrate(state), save();

function migrate(s){
  const map={};
  for(const k in s.cells){
    const m=k.match(/^([AB])-(\d{2})$/);
    if(m){ const n=parseInt(m[2],10); if(n>=9&&n<=80) map[k]=m[1]+'-'+String(n-8).padStart(2,'0'); }
  }
  const nc={};
  for(const k in s.cells) nc[map[k]||k]=s.cells[k];
  s.cells=nc; s.v=2; if(!s.titles) s.titles={};
  return s;
}
function save(){ localStorage.setItem(KEY,JSON.stringify(state)); }
function ghCfg(){ try{ return JSON.parse(localStorage.getItem(GHKEY)||'{}'); }catch(e){ return {}; } }
function ghAuto(){ const c=ghCfg(); if(c.token&&c.auto){ clearTimeout(ghAuto.t); ghAuto.t=setTimeout(()=>ghPush(true),2500); } }

function cellCode(sec,r,c){
  if(sec.type==='deko') return sec.id+'-'+String((r-1)*sec.cols+c).padStart(2,'0');
  if(sec.type==='mini') return sec.id+'-0'+r+'0'+c;
  return sec.labels[c-1];
}
function render(){
  const q=(document.getElementById('search').value||'').toLowerCase().trim();
  const app=document.getElementById('app'); app.innerHTML='';
  for(const sec of SECTIONS){
    const title=(state.titles&&state.titles[sec.id])||sec.title;
    const p=document.createElement('div');
    p.className='panel'+(sec.type==='deko'?' panel-wide':'');
    p.innerHTML='<div class="panel-head"><div class="panel-title">'+title+
      '</div><button class="rename-btn" onclick="rename(\''+sec.id+'\')">✏ переименовать</button></div>';
    const g=document.createElement('div');
    g.className='grid '+(sec.cols===8?'g8':(sec.cols===3?'g3':'g2'));
    for(let r=1;r<=sec.rows;r++) for(let c=1;c<=sec.cols;c++){
      const code=cellCode(sec,r,c);
      const d=state.cells[code];
      const name=d?(d.n||''):'';
      const match=!q||((name+' '+(d&&d.note||'')+' '+(d&&d.c||'')+' '+code).toLowerCase().includes(q));
      const el=document.createElement('div');
      el.className='cell'+(name?' filled':'')+((q&&!match)?' dim':'');
      if(name) el.title=name;
      el.innerHTML='<div class="code">'+code+'</div><div class="row">'+
        (name?'<span class="dot" style="background:'+(CATS[d.c]||'#f06292')+'"></span>':'')+
        '<span class="name">'+(name||'')+'</span></div>';
      el.onclick=()=>{ el.classList.add('pop'); setTimeout(()=>openModal(sec,code),260); };
      g.appendChild(el);
    }
    p.appendChild(g); app.appendChild(p);
  }
}
let current=null;
function openModal(sec,code){
  current={sec,code};
  const d=state.cells[code]||{};
  document.getElementById('mTitle').textContent=code+' — '+((state.titles&&state.titles[sec.id])||sec.title);
  document.getElementById('fName').value=d.n||'';
  document.getElementById('fCat').value=d.c||'Прочее';
  document.getElementById('fQty').value=d.qty||'';
  document.getElementById('fNote').value=d.note||'';
  showOverlay(); show('modal');
}
function show(id){ document.getElementById(id).classList.add('show'); }
function showOverlay(){ document.getElementById('overlay').classList.add('show'); }
function closeAll(){
  document.getElementById('overlay').classList.remove('show');
  for(const id of ['modal','modalAdd','modalSet']) document.getElementById(id).classList.remove('show');
}
function saveCell(){
  const n=document.getElementById('fName').value.trim();
  if(n) state.cells[current.code]={n:n,c:document.getElementById('fCat').value,
    qty:document.getElementById('fQty').value,note:document.getElementById('fNote').value.trim()};
  else delete state.cells[current.code];
  save(); ghAuto(); render(); closeAll();
}
function clearCell(){ delete state.cells[current.code]; save(); ghAuto(); render(); closeAll(); }
function rename(id){
  const sec=SECTIONS.find(s=>s.id===id);
  const t=prompt('Новое название секции:',(state.titles&&state.titles[id])||sec.title);
  if(t&&t.trim()){ if(!state.titles)state.titles={}; state.titles[id]=t.trim(); save(); ghAuto(); render(); }
}

// ---------- Умное добавление ----------
let aCatTouched=false, aCellTouched=false;
function classify(name){
  for(const r of CLASS_RULES) if(r.re.test(name)) return r;
  return {cell:'',cat:'Прочее'};
}
function firstFree(){
  for(const sec of SECTIONS){ if(sec.type!=='deko') continue;
    for(let r=1;r<=sec.rows;r++) for(let c=1;c<=sec.cols;c++){
      const code=cellCode(sec,r,c); if(!state.cells[code]) return code;
    }
  }
  return 'A-01';
}
function tokens(s){
  return (s||'').toLowerCase().split(/[^a-zа-яё0-9.µ]+/i)
    .filter(w=>w.length>=2||/^\d+$/.test(w));
}
function simScore(a,b){
  const ta=new Set(tokens(a)), tb=new Set(tokens(b)); let s=0;
  for(const t of ta) if(tb.has(t)) s++;
  return s;
}
function bestMatch(name){
  let best=null;
  for(const code in state.cells){
    const d=state.cells[code]; if(!d) continue;
    const sc=simScore(name,(d.n||'')+' '+(d.note||''));
    if(sc>0 && (!best||sc>best.sc)) best={code,sc,d};
  }
  return best;
}
function openAdd(){
  aCatTouched=false; aCellTouched=false;
  document.getElementById('aName').value='';
  document.getElementById('aQty').value='';
  document.getElementById('aNote').value='';
  const list=document.getElementById('cellList'); list.innerHTML='';
  for(const sec of SECTIONS){ if(sec.type!=='deko') continue;
    for(let r=1;r<=sec.rows;r++) for(let c=1;c<=sec.cols;c++){
      const code=cellCode(sec,r,c); const d=state.cells[code];
      const o=document.createElement('option'); o.value=code;
      o.label=d?d.n:'свободен'; list.appendChild(o);
    }
  }
  showCellInfo();
  showOverlay(); show('modalAdd');
  document.getElementById('aName').focus();
}
function suggest(){
  const n=document.getElementById('aName').value.trim();
  if(!n) return;
  const cls=classify(n);
  if(!aCatTouched) document.getElementById('aCat').value=cls.cat;
  if(!aCellTouched) document.getElementById('aCell').value=cls.cell||firstFree();
  showCellInfo();
}
function showCellInfo(){
  const info=document.getElementById('aInfo'), btn=document.getElementById('aMergeBtn');
  let cell=(document.getElementById('aCell').value||'').trim().toUpperCase().replace(/А/g,'A').replace(/[\s–—-]+/g,'-');
  const d=state.cells[cell];
  const n=document.getElementById('aName').value.trim();
  if(!d){ info.style.display='none'; btn.style.display='none'; return; }
  const sc=n?simScore(n,(d.n||'')+' '+(d.note||'')):0;
  info.style.display='block';
  info.className='aInfo'+(sc?'':' warn');
  info.innerHTML='В ящике <b>'+cell+'</b> уже лежит: «'+(d.n||'')+'»'+
    (d.qty?' ×'+d.qty:'')+(sc?' — похоже на ваше, можно дописать':' — ящик занят другой деталью');
  btn.style.display = (d&&n) ? 'inline-block' : 'none';
}
function saveAdd(merge){
  const n=document.getElementById('aName').value.trim();
  if(!n){ alert('Введите название'); return; }
  let cell=(document.getElementById('aCell').value||'').trim().toUpperCase().replace(/А/g,'A').replace(/[\s–—-]+/g,'-');
  if(!/^[A-F]-\d{4}$/.test(cell) && !/^[AB]-\d{2}$/.test(cell) && !['AAA','AA'].includes(cell)){
    alert('Неверный код ящика: '+cell); return;
  }
  const cat=document.getElementById('aCat').value;
  const qty=parseInt(document.getElementById('aQty').value)||0;
  const note=document.getElementById('aNote').value.trim();
  if(merge){
    const d=state.cells[cell]||{n:'',c:cat,qty:'',note:''};
    const dq=parseInt(d.qty)||0;
    state.cells[cell]={n:d.n||n,c:cat||d.c||'Прочее',qty:(dq+qty)||dq||'',
      note:(d.note?d.note+'\n':'')+'+ '+n+(qty?' ×'+qty:'')+(note?' — '+note:'')};
  }else{
    if(state.cells[cell] && !confirm('Ящик '+cell+' уже занят («'+state.cells[cell].n+'»).\nЗаменить содержимое?')) return;
    state.cells[cell]={n:n,c:cat,qty:qty||'',note:note};
  }
  save(); ghAuto(); render(); closeAll();
}

// ---------- GitHub ----------
function setStatus(t){
  const el=document.getElementById('ghStatus'); el.textContent=t;
  if(t) setTimeout(()=>{ if(el.textContent===t) el.textContent=''; },7000);
}
function b64e(s){ return btoa(unescape(encodeURIComponent(s))); }
function b64d(s){ return decodeURIComponent(escape(atob(s.replace(/\s/g,'')))); }
async function ghPush(silent){
  const c=ghCfg();
  if(!c.user||!c.repo||!c.token){
    if(!silent) openSettings('Для синхронизации заполните настройки GitHub');
    else setStatus('Автосейв пропущен: нет настроек GitHub');
    return;
  }
  setStatus('⬆️ Сохраняю на GitHub…');
  try{
    const url='https://api.github.com/repos/'+c.user+'/'+c.repo+'/contents/cartoteka.json';
    const H={'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json'};
    let sha=null;
    const r=await fetch(url,{headers:H});
    if(r.ok){ sha=(await r.json()).sha; }
    const body={message:'Обновление картотеки ('+new Date().toLocaleString('ru-RU')+')',
      content:b64e(JSON.stringify(state,null,2))};
    if(sha) body.sha=sha;
    const r2=await fetch(url,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},H),body:JSON.stringify(body)});
    if(r2.ok) setStatus('✅ Сохранено на GitHub');
    else{ const e=await r2.json().catch(()=>({})); setStatus('❌ Ошибка GitHub: '+(e.message||r2.status)); }
  }catch(e){ setStatus('❌ Нет связи с GitHub'); }
}
async function ghPull(){
  const c=ghCfg();
  if(!c.user||!c.repo||!c.token){ openSettings('Для загрузки заполните настройки GitHub'); return; }
  setStatus('⬇️ Загружаю с GitHub…');
  try{
    const url='https://api.github.com/repos/'+c.user+'/'+c.repo+'/contents/cartoteka.json';
    const r=await fetch(url,{headers:{'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json'}});
    if(!r.ok){ setStatus('❌ Файл cartoteka.json не найден (или нет доступа), код '+r.status); return; }
    const j=await r.json();
    const s=JSON.parse(b64d(j.content));
    if(!s||!s.cells){ setStatus('❌ Неверный формат файла'); return; }
    if(!confirm('Заменить локальные данные данными с GitHub?')){ setStatus('Загрузка отменена'); return; }
    state=migrate(s); save(); render();
    setStatus('✅ Загружено с GitHub: '+Object.keys(state.cells).length+' записей');
  }catch(e){ setStatus('❌ Нет связи с GitHub: '+e.message); }
}
function openSettings(msg){
  const c=ghCfg();
  document.getElementById('sUser').value=c.user||'';
  document.getElementById('sRepo').value=c.repo||'';
  document.getElementById('sToken').value=c.token||'';
  document.getElementById('sAuto').checked=!!c.auto;
  document.getElementById('sConfirm').value='';
  document.getElementById('setMsg').textContent=msg||'';
  showOverlay(); show('modalSet');
}
function saveSettings(){
  localStorage.setItem(GHKEY,JSON.stringify({
    user:document.getElementById('sUser').value.trim(),
    repo:document.getElementById('sRepo').value.trim(),
    token:document.getElementById('sToken').value.trim(),
    auto:document.getElementById('sAuto').checked
  }));
  setStatus('Настройки сохранены'); closeAll();
}
function dangerClear(){
  if(document.getElementById('sConfirm').value!=='УДАЛИТЬ'){
    alert('Введите слово УДАЛИТЬ, чтобы подтвердить очистку.'); return;
  }
  if(!confirm('Точно удалить ВСЕ записи? Восстановить можно только импортом JSON или с GitHub.')) return;
  state={v:2,titles:{},cells:{}};
  for(const k in DEFAULTS) state.cells[k]=Object.assign({},DEFAULTS[k],{qty:'',note:''});
  save(); render(); closeAll();
}

// ---------- Импорт/экспорт ----------
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeAll(); });
document.getElementById('search').addEventListener('input',render);
function exportJSON(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='cartoteka.json'; a.click();
}
function importJSON(ev){
  const f=ev.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{
      const s=JSON.parse(rd.result);
      if(s&&s.cells){
        if(!confirm('Заменить текущие данные содержимым файла?')){ ev.target.value=''; return; }
        state=migrate(s); save(); render();
        alert('Импортировано: '+Object.keys(state.cells).length+' записей');
      }
    }catch(e){ alert('Не удалось прочитать файл: '+e); } };
  rd.readAsText(f); ev.target.value='';
}
function exportCSV(){
  const rows=[['Ящик','Секция','Название','Категория','Кол-во','Заметка']];
  for(const sec of SECTIONS){ const title=(state.titles&&state.titles[sec.id])||sec.title;
    for(let r=1;r<=sec.rows;r++) for(let c=1;c<=sec.cols;c++){
      const code=cellCode(sec,r,c), d=state.cells[code];
      if(d) rows.push([code,title,d.n,d.c||'',d.qty||'',d.note||'']);
    } }
  const csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'}); const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='cartoteka.csv'; a.click();
}

// селект категорий
for(const selId of ['fCat','aCat']){
  const sel=document.getElementById(selId);
  for(const c in CATS){ const o=document.createElement('option'); o.value=c; o.textContent=c; sel.appendChild(o); }
}
render();
</script>
