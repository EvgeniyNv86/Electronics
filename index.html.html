<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Тест: AC и DC</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
    background:#0e1117; color:#e8eaf0; min-height:100vh;
    padding:16px; max-width:520px; margin:0 auto;
  }
  .screen { display:none; }
  .screen.active { display:block; animation:fade .25s ease; }
  @keyframes fade { from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
  h1 { font-size:1.35rem; line-height:1.3; margin-bottom:12px; }
  h2 { font-size:1.05rem; margin:14px 0 10px; }
  .sub { color:#9aa3b2; font-size:.95rem; line-height:1.5; margin-bottom:20px; }
  .scale { background:#171c26; border:1px solid #262d3a; border-radius:12px; padding:14px 16px; margin-bottom:20px; }
  .scale div { font-size:.92rem; padding:4px 0; color:#c6cdd8; }
  button {
    width:100%; padding:15px; font-size:1.05rem; font-weight:600;
    background:linear-gradient(135deg,#3d7bff,#7b4dff);
    color:#fff; border:none; border-radius:12px; cursor:pointer;
    transition:transform .12s ease, opacity .12s ease;
  }
  button:active { transform:scale(.97); }
  button:disabled { opacity:.4; cursor:default; transform:none; }
  .topbar { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .bar { flex:1; height:6px; background:#262d3a; border-radius:3px; overflow:hidden; }
  .bar i { display:block; height:100%; width:0%; background:linear-gradient(90deg,#3d7bff,#7b4dff); transition:width .3s ease; }
  .qnum { font-size:.85rem; color:#9aa3b2; white-space:nowrap; }
  .qtext { font-size:1.1rem; line-height:1.45; margin-bottom:18px; font-weight:500; }
  .opt {
    background:#171c26; border:2px solid #262d3a; border-radius:12px;
    padding:14px; margin-bottom:10px; cursor:pointer; font-size:.98rem; line-height:1.4;
    transition:border-color .15s ease, background .15s ease;
  }
  .opt:active { transform:scale(.985); }
  .opt.sel { border-color:#3d7bff; background:#1a2337; }
  .navrow { margin-top:16px; }
  .score-big { font-size:2.6rem; font-weight:700; text-align:center; margin:10px 0 4px; }
  .score-cap { text-align:center; color:#9aa3b2; margin-bottom:18px; }
  .verdict { text-align:center; font-size:1.1rem; font-weight:600; margin-bottom:18px; }
  .dots { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:20px; }
  .dot { width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.85rem; font-weight:600; }
  .dot.ok { background:#1d3a24; color:#4ade80; }
  .dot.bad { background:#3a1d1d; color:#f87171; }
  .review { background:#171c26; border:1px solid #262d3a; border-radius:12px; padding:14px; margin-bottom:12px; }
  .review .tag { font-size:.8rem; font-weight:700; margin-bottom:6px; }
  .tag.ok { color:#4ade80; } .tag.bad { color:#f87171; }
  .review .q { font-size:.95rem; margin-bottom:8px; }
  .review .ans { font-size:.88rem; color:#c6cdd8; line-height:1.45; }
  .review .ans b { color:#e8eaf0; }
</style>
</head>
<body>

<!-- ЭКРАН 1: СТАРТ -->
<div class="screen active" id="s0">
  <h1>⚡️ Тест: постоянный и переменный ток</h1>
  <p class="sub">10 вопросов от простых до каверзных. Проверьте, чем розетка отличается от батарейки — и почему в зарядке пищит.</p>
  <div class="scale">
    <div>🔥 9–10 — база крепкая</div>
    <div>⚡ 6–8 — стоит освежить кое-что</div>
    <div>🧰 до 5 — отличный старт</div>
  </div>
  <button id="btnStart">Начать тест</button>
</div>

<!-- ЭКРАН 2: ВОПРОС -->
<div class="screen" id="s1">
  <div class="topbar">
    <span class="qnum" id="qnum"></span>
    <div class="bar"><i id="barfill"></i></div>
  </div>
  <p class="qtext" id="qtext"></p>
  <div id="opts"></div>
  <div class="navrow"><button id="btnNext" disabled>Дальше →</button></div>
</div>

<!-- ЭКРАН 3: РЕЗУЛЬТАТ -->
<div class="screen" id="s2">
  <h2 style="text-align:center">Результат</h2>
  <div class="score-big" id="scoreBig"></div>
  <div class="score-cap">правильных ответов из 10</div>
  <div class="verdict" id="verdict"></div>
  <div class="dots" id="dots"></div>
  <h2>Разбор ответов</h2>
  <div id="review"></div>
  <button id="btnAgain" style="margin-top:8px">Пройти ещё раз</button>
</div>

<script>
// MAX Bridge: убрать экран загрузки (безопасно, если вне MAX)
try { if (window.WebApp && typeof window.WebApp.ready === 'function') window.WebApp.ready(); } catch(e) {}

var QUESTIONS = [
  { q:'Что означает аббревиатура DC?',
    opts:['Direct Current — постоянный ток','Direct Circuit — прямая цепь','Dynamic Charge — динамический заряд'],
    a:0, why:'DC — Direct Current (постоянный ток), AC — Alternating Current (переменный).' },
  { q:'Как меняется напряжение в бытовой сети?',
    opts:['Не меняется никогда','Меняется по синусоиде: от плюса к минусу и обратно','Скачет случайным образом'],
    a:1, why:'Классическая синусоида от +311 В до −311 В. Откуда 311? Это пик при действующих 220 В — см. вопрос 9.' },
  { q:'Какое напряжение и частота в розетке в России?',
    opts:['220 В, 50 Гц','110 В, 60 Гц','380 В, 50 Гц'],
    a:0, why:'220 В / 50 Гц. В США — 110–120 В / 60 Гц, поэтому их техника к нашей сети без трансформатора не подключается.' },
  { q:'Что означает частота 50 Гц?',
    opts:['50 колебаний напряжения в секунду','50 ватт мощности','50 фаз в сети'],
    a:0, why:'Ток проходит полный цикл «плюс–минус–плюс» 50 раз в секунду. Период цикла T = 1/50 = 0,02 с — всего 20 мс.' },
  { q:'Какой ток даёт батарейка АА?',
    opts:['Переменный, 50 Гц','Постоянный','Импульсный'],
    a:1, why:'Постоянный и стабильный — на этом держится вся портативная электроника.' },
  { q:'Что сделает конденсатор с идеальным постоянным током?',
    opts:['Зарядится, и ток прекратится','Будет пропускать ток как проводник','Нагреется до отказа'],
    a:0, why:'Для постоянного тока конденсатор — разрыв цепи после заряда. А вот переменный он пропускает, и его сопротивление зависит от частоты — на этом строят фильтры.' },
  { q:'Почему ЛЭП исторически строят на переменном токе?',
    opts:['Он «сильнее»','Напряжение легко повышать и понижать трансформатором — меньше потерь','Так случайно сложилось'],
    a:1, why:'Трансформатор работает только на переменном токе: подняли до сотен тысяч вольт — ток упал — потери на нагрев проводов в разы меньше.' },
  { q:'Что делает диод в цепи переменного тока?',
    opts:['Усиливает сигнал','Пропускает ток только в одну сторону — выпрямляет','Меняет частоту'],
    a:1, why:'Диод — односторонний клапан. Мост из четырёх диодов выпрямляет обе полуволны — получается пульсирующий постоянный ток.' },
  { q:'Что такое действующее значение напряжения (RMS)?',
    opts:['Максимальный пик','Эквивалент по мощности: постоянное напряжение, дающее то же тепло','Среднее арифметическое'],
    a:1, why:'Для синуса: U_RMS = U_пик / √2. Пик 311 В даёт те самые 220 В действующих. Поэтому конденсаторы в блоках питания выбирают с запасом по пику.' },
  { q:'Что внутри зарядки превращает переменный ток в постоянный?',
    opts:['Трансформатор','Выпрямитель (диодный мост) + сглаживающий конденсатор','Генератор'],
    a:1, why:'Цепочка: преобразователь → диодный мост → конденсатор-фильтр → стабилизатор. Писк дешёвой зарядки — импульсный преобразователь на десятках килогерц.' }
];

var cur = 0;
var picked = new Array(QUESTIONS.length).fill(-1);

function show(id) {
  var s = document.querySelectorAll('.screen');
  for (var i = 0; i < s.length; i++) s[i].classList.remove('active');
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function buzz(ms) {
  try { if (window.WebApp && WebApp.haptic && typeof WebApp.haptic === 'function') WebApp.haptic(ms); } catch(e) {}
}

function renderQ() {
  var q = QUESTIONS[cur];
  document.getElementById('qnum').textContent = 'Вопрос ' + (cur + 1) + ' / ' + QUESTIONS.length;
  document.getElementById('barfill').style.width = (cur / QUESTIONS.length * 100) + '%';
  document.getElementById('qtext').textContent = q.q;

  var box = document.getElementById('opts');
  box.innerHTML = '';
  var letters = ['А', 'Б', 'В'];
  for (var i = 0; i < q.opts.length; i++) {
    var d = document.createElement('div');
    d.className = 'opt' + (picked[cur] === i ? ' sel' : '');
    d.textContent = letters[i] + ') ' + q.opts[i];
    (function(idx) {
      d.onclick = function() {
        picked[cur] = idx;
        buzz(30);
        var all = box.children;
        for (var k = 0; k < all.length; k++) all[k].classList.remove('sel');
        d.classList.add('sel');
        document.getElementById('btnNext').disabled = false;
        if (cur === QUESTIONS.length - 1) document.getElementById('btnNext').textContent = 'Показать результат';
      };
    })(i);
    box.appendChild(d);
  }
  document.getElementById('btnNext').disabled = picked[cur] < 0;
}

function finish() {
  var score = 0, dots = '', rev = '';
  var letters = ['А', 'Б', 'В'];
  for (var i = 0; i < QUESTIONS.length; i++) {
    var ok = picked[i] === QUESTIONS[i].a;
    if (ok) score++;
    dots += '<div class="dot ' + (ok ? 'ok' : 'bad') + '">' + (i + 1) + '</div>';
    rev += '<div class="review">'
      + '<div class="tag ' + (ok ? 'ok' : 'bad') + '">' + (ok ? '✓ Верно' : '✗ Ошибка') + '</div>'
      + '<div class="q">' + (i + 1) + '. ' + QUESTIONS[i].q + '</div>'
      + '<div class="ans">Правильно: <b>' + letters[QUESTIONS[i].a] + ') ' + QUESTIONS[i].opts[QUESTIONS[i].a] + '</b><br>'
      + QUESTIONS[i].why + '</div></div>';
  }
  document.getElementById('scoreBig').textContent = score + ' / 10';
  document.getElementById('verdict').textContent =
    score >= 9 ? '🔥 База крепкая!' : score >= 6 ? '⚡ Неплохо, освежите конденсаторы' : '🧰 Есть куда расти — этот тест как раз про это';
  document.getElementById('dots').innerHTML = dots;
  document.getElementById('review').innerHTML = rev;
  document.getElementById('barfill').style.width = '100%';
  show('s2');
}

// Привязка обработчиков
document.getElementById('btnStart').onclick = function() { cur = 0; renderQ(); show('s1'); };

document.getElementById('btnNext').onclick = function() {
  if (picked[cur] < 0) return;
  if (cur < QUESTIONS.length - 1) { cur++; renderQ(); }
  else { finish(); }
};

document.getElementById('btnAgain').onclick = function() {
  picked = new Array(QUESTIONS.length).fill(-1);
  document.getElementById('btnNext').textContent = 'Дальше →';
  show('s0');
};
</script>
</body>
</html>
