<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ревизия баллонов</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; background: #f2f4f8; color: #1c2733; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  .sub { color: #5b6b7b; font-size: 14px; margin-bottom: 12px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0; }
  .stat { background: #fff; border-radius: 12px; padding: 10px 6px; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .stat b { display: block; font-size: 20px; }
  .stat span { font-size: 11px; color: #5b6b7b; }
  .card { background: #fff; border-radius: 16px; padding: 16px; margin: 12px 0; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .card h2 { font-size: 17px; margin: 0 0 12px; color: #14508c; }
  label { display: block; font-size: 13px; color: #5b6b7b; margin: 10px 0 4px; }
  input, select { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #cfd8e3; border-radius: 10px; background: #fff; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  button { width: 100%; padding: 14px; font-size: 17px; border: none; border-radius: 12px; background: #14508c; color: #fff; font-weight: 600; margin-top: 14px; cursor: pointer; }
  button.gray { background: #e8edf3; color: #1c2733; }
  .msg { padding: 12px; border-radius: 10px; margin: 10px 0; font-size: 14px; }
  .ok { background: #e7f6ec; color: #1d6a34; }
  .err { background: #fdeaea; color: #a12a2a; }
  .entry { background: #fff; border-radius: 12px; padding: 10px 12px; margin: 8px 0; display: flex; align-items: center; gap: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .entry .info { flex: 1; font-size: 14px; }
  .entry .info b { font-size: 15px; }
  .entry .del { color: #a12a2a; font-size: 18px; background: none; border: none; padding: 6px; margin: 0; width: auto; cursor: pointer; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 8px; font-size: 12px; margin-left: 6px; }
  .t-full { background: #e7f6ec; color: #1d6a34; }
  .t-empty { background: #fff4e0; color: #8a5a00; }
  .t-bad { background: #fdeaea; color: #a12a2a; }
  .t-gaslab { background: #e8f0fe; color: #14508c; }
  .t-work { background: #f3e8fe; color: #6a1da1; }
  .t-al { background: #e8f0fe; color: #14508c; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Ревизия баллонов</h1>
  <div class="sub">Добавляйте баллоны по одному. Данные сохраняются в телефоне.</div>

  <div class="stats">
    <div class="stat"><b id="stAll">0</b><span>всего</span></div>
    <div class="stat"><b id="stFull">0</b><span>полных</span></div>
    <div class="stat"><b id="stEmpty">0</b><span>пустых</span></div>
    <div class="stat"><b id="stBad">0</b><span>не годн.</span></div>
    <div class="stat"><b id="stGaslab">0</b><span>Газ-Лаб</span></div>
    <div class="stat"><b id="stWork">0</b><span>в работе</span></div>
    <div class="stat"><b id="stAl">0</b><span>алюм.</span></div>
    <div class="stat"><b id="stSt">0</b><span>металл</span></div>
  </div>

  <div class="card">
    <h2>Новый баллон</h2>
    <div id="msg"></div>
    <label>№ баллона *</label>
    <input id="num" inputmode="numeric" placeholder="например 02871">
    <label>№ паспорта (если читается)</label>
    <input id="pass" placeholder="например 04534-26">
    <div class="row">
      <div>
        <label>Материал</label>
        <select id="mat"><option>Алюминий</option><option>Металл</option></select>
      </div>
      <div>
        <label>Состояние</label>
        <select id="cond" onchange="condChanged()">
          <option value="full">Полный</option>
          <option value="empty">Пустой</option>
          <option value="gaslab">В Газ-Лабе</option>
          <option value="work">В работе</option>
          <option value="bad">Не годен</option>
        </select>
      </div>
    </div>
    <div id="gasBlock">
      <label>Газ</label>
      <select id="gas">
        <option>Метан (CH4)</option>
        <option>Сероводород (H2S)</option>
        <option>Оксид углерода (CO)</option>
        <option>Кислород (O2)</option>
        <option>Пропан (C3H8)</option>
        <option>Азот (N2)</option>
        <option>Воздух</option>
        <option>Аргон (Ar)</option>
        <option>Углекислота (CO2)</option>
        <option>Гелий (He)</option>
        <option>Водород (H2)</option>
      </select>
      <label>Концентрация, % об. д.</label>
      <input id="conc" inputmode="decimal" placeholder="например 97.56">
    </div>
    <button onclick="add()">Внести</button>
  </div>

  <div class="card">
    <h2>Ведомость (<span id="cnt">0</span>)</h2>
    <div id="list"></div>
    <button class="gray" onclick="downloadCSV()">Скачать CSV для Excel</button>
    <button class="gray" onclick="copyAll()">Скопировать журнал</button>
    <button class="gray" onclick="clearAll()">Очистить всё</button>
  </div>
</div>

<script>
const KEY = 'balloon_rev';
let items = JSON.parse(localStorage.getItem(KEY) || '[]');

function save() { localStorage.setItem(KEY, JSON.stringify(items)); }

function condChanged() {
  document.getElementById('gasBlock').style.display =
    document.getElementById('cond').value === 'full' ? 'block' : 'none';
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function condName(c) {
  return c==='full' ? 'полный' : c==='empty' ? 'пустой' : c==='gaslab' ? 'в Газ-Лабе' : c==='work' ? 'в работе' : 'не годен';
}
function condTag(c) {
  const cls = c==='full' ? 't-full' : c==='empty' ? 't-empty' : c==='gaslab' ? 't-gaslab' : c==='work' ? 't-work' : 't-bad';
  return '<span class="tag ' + cls + '">' + condName(c) + '</span>';
}

function render() {
  document.getElementById('stAll').textContent = items.length;
  document.getElementById('stFull').textContent = items.filter(i => i.cond==='full').length;
  document.getElementById('stEmpty').textContent = items.filter(i => i.cond==='empty').length;
  document.getElementById('stBad').textContent = items.filter(i => i.cond==='bad').length;
  document.getElementById('stGaslab').textContent = items.filter(i => i.cond==='gaslab').length;
  document.getElementById('stWork').textContent = items.filter(i => i.cond==='work').length;
  document.getElementById('stAl').textContent = items.filter(i => i.mat==='Алюминий').length;
  document.getElementById('stSt').textContent = items.filter(i => i.mat==='Металл').length;
  document.getElementById('cnt').textContent = items.length;
  const list = document.getElementById('list');
  list.innerHTML = items.map((it, idx) => {
    const gas = it.cond==='full' ? ' · ' + esc(it.gas) + (it.conc ? ' ' + esc(it.conc) + '%' : '') : '';
    return '<div class="entry"><div class="info"><b>№ ' + esc(it.num) + '</b>' + condTag(it.cond) +
      '<span class="tag t-al">' + esc(it.mat) + '</span><br>' +
      (it.pass ? 'паспорт ' + esc(it.pass) : 'паспорт —') + gas +
      '</div><button class="del" onclick="del(' + idx + ')">✕</button></div>';
  }).join('');
}

function show(text, cls) {
  const m = document.getElementById('msg');
  m.innerHTML = '<div class="msg ' + cls + '">' + text + '</div>';
  setTimeout(() => { m.innerHTML = ''; }, 5000);
}

function add() {
  const num = document.getElementById('num').value.trim();
  if (!num) { show('Введите номер баллона', 'err'); return; }
  if (items.some(i => i.num === num)) { show('Баллон № ' + esc(num) + ' уже записан', 'err'); return; }
  const cond = document.getElementById('cond').value;
  const it = {
    num: num,
    pass: document.getElementById('pass').value.trim(),
    mat: document.getElementById('mat').value,
    cond: cond,
    gas: cond==='full' ? document.getElementById('gas').value : '',
    conc: cond==='full' ? document.getElementById('conc').value.trim() : '',
    time: new Date().toLocaleString('ru-RU')
  };
  items.push(it);
  save(); render();
  document.getElementById('num').value = '';
  document.getElementById('pass').value = '';
  document.getElementById('conc').value = '';
  document.getElementById('num').focus();
  show('Записан баллон № ' + esc(num), 'ok');
}

function del(idx) { items.splice(idx, 1); save(); render(); }

function csv() {
  const rows = [['№ баллона','№ паспорта','Материал','Состояние','Газ','Концентрация %','Время']];
  items.forEach(i => rows.push([i.num, i.pass, i.mat, condName(i.cond), i.gas, i.conc, i.time]));
  return '\uFEFF' + rows.map(r => r.map(c => '"' + String(c).replace(/"/g,'""') + '"').join(';')).join('\n');
}

function downloadCSV() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv()], {type: 'text/csv'}));
  a.download = 'revizia_ballonov.csv';
  a.click();
}

function copyAll() {
  navigator.clipboard.writeText(csv()).then(
    () => alert('Скопировано. Вставьте в Excel через Ctrl+V — колонки разойдутся сами.'),
    () => alert('Не удалось скопировать. Используйте кнопку "Скачать CSV".')
  );
}

function clearAll() {
  if (confirm('Удалить все записи? Отменить будет нельзя.')) { items = []; save(); render(); }
}

render(); condChanged();
</script>
</body>
</html>
