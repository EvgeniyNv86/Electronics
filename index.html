<!DOCTYPE html><html lang='ru'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Электрошкола</title><style>*{box-sizing:border-box;margin:0;font-family:'Segoe UI',Arial,sans-serif}body{background:#0f172a;color:#e2e8f0;padding:14px;max-width:720px;margin:0 auto}h1{font-size:25px;margin:6px 0}h2{margin:12px 0 8px}.card{background:#1e293b;border-radius:14px;padding:12px;margin:10px 0}.tile{display:block;background:#1d4ed8;color:#fff;border:none;border-radius:14px;padding:14px;font-size:16px;width:100%;margin:8px 0;cursor:pointer;text-align:left}.gold{background:#b45309}.green{background:#15803d}.red{background:#b91c1c}.gray{background:#334155}.btn{background:#2563eb;color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:15px;cursor:pointer;margin:4px 4px 0 0}.opt{display:block;width:100%;text-align:left;background:#334155;color:#e2e8f0;border:2px solid #334155;border-radius:10px;padding:10px;margin:6px 0;font-size:15px;cursor:pointer}.opt.ok{border-color:#22c55e;background:#14532d}.opt.no{border-color:#ef4444;background:#7f1d1d}input,textarea,select{display:block;width:100%;padding:10px;margin:6px 0;border-radius:10px;border:1px solid #475569;background:#0f172a;color:#e2e8f0;font-size:15px}textarea{min-height:70px}.big{font-size:22px;font-weight:bold}table{width:100%;border-collapse:collapse;margin:8px 0}td,th{border:1px solid #475569;padding:5px;font-size:13px}.mut{color:#94a3b8;font-size:13px}.code{background:#000;border-radius:8px;padding:8px;word-break:break-all;font-family:monospace;margin:8px 0}</style></head><body><div id='app'></div><script>const WEEKS=[{"t": "Что такое электричество", "f": ["Электричество — это движение крошечных заряженных частиц — электронов.", "Всё вокруг состоит из атомов: внутри — ядро и электроны, которые крутятся вокруг него.", "Ток — это поток электронов по проводу, как река из крошечных шариков.", "Напряжение — это «давление», которое толкает электроны. Измеряется в вольтах (В).", "Батарейка АА даёт 1,5 В. В розетке — 220 В, и её трогать нельзя никогда.", "Сила тока измеряется в амперах (А): чем больше ампер, тем больше электронов бежит по проводу.", "Проводник (медь, алюминий) пропускает ток. Изолятор (пластик, резина) — нет, поэтому провода в оплётке.", "Все опыты делай только с батарейками и вместе со взрослыми."], "q": [["Электрический ток — это…", ["поток электронов по проводнику", "свет в лампочке", "звук в проводе", "пыль в розетке"], 0], ["В чём измеряется напряжение?", ["в вольтах", "в граммах", "в метрах", "в литрах"], 0], ["Сколько вольт даёт батарейка АА?", ["220 В", "1,5 В", "12 В", "1000 В"], 1], ["Что из этого НЕЛЬЗЯ трогать?", ["батарейку АА", "резиновый провод без вилки", "розетку под напряжением", "ластик"], 2], ["Медь — это…", ["изолятор", "проводник", "животное", "планета"], 1]]}, {"t": "Электрическая цепь", "f": ["Цепь — это путь, по которому бежит ток: от источника через провода к прибору и обратно.", "В простой цепи есть: источник питания, провода, нагрузка (лампочка) и выключатель.", "Замкнутая цепь — ток идёт по кругу, лампочка горит.", "Разомкнутая цепь — путь оборван, ток не идёт, лампочка гаснет. Так работает выключатель.", "Схема — это рисунок цепи из условных значков. Электрики так читают устройства.", "Короткое замыкание — ток идёт мимо лампочки напрямую. Провода греются, батарейка садится. Так делать нельзя."], "q": [["Зачем в цепи выключатель?", ["чтобы украсить схему", "размыкать цепь и останавливать ток", "усиливать ток", "искрить"], 1], ["Что будет, если цепь разомкнуть?", ["лампочка загорится ярче", "ток пойдёт быстрее", "ток перестанет идти", "ничего"], 2], ["Из чего НЕ состоит простая цепь?", ["источника питания", "провода", "телевизора", "нагрузки"], 2], ["Что такое схема?", ["фото цепи", "рисунок цепи из условных значков", "песня о токе", "вид провода"], 1], ["Чем опасно короткое замыкание?", ["провода и батарейка перегреваются", "лампочка светит ярче", "напряжение растёт", "ничем"], 0]]}, {"t": "Напряжение, ток, сопротивление", "f": ["Напряжение (U) — вольты, ток (I) — амперы, сопротивление (R) — омы. Это три главные величины.", "Сопротивление мешает току: узкая труба пропускает меньше воды, тонкий провод — меньше тока.", "Сопротивление зависит от материала, длины и толщины провода: длиннее и тоньше — больше сопротивление.", "Мультиметр — прибор-мультиспец: умеет мерить и вольты, и амперы, и омы.", "Амперметр включают в цепь последовательно (в разрыв), вольтметр — параллельно (к двум точкам).", "Батареи из нескольких элементов дают больше напряжения: 4 батарейки по 1,5 В — это 6 В."], "q": [["Сопротивление измеряется в…", ["омах", "вольтах", "амперах", "фарсах"], 0], ["Что измеряет мультиметр?", ["только вольты", "только амперы", "напряжение, ток и сопротивление", "погоду"], 2], ["Если провод сделать тоньше и длиннее, сопротивление…", ["уменьшится", "не изменится", "увеличится", "исчезнет"], 2], ["Вольтметр подключают…", ["в разрыв цепи", "параллельно к двум точкам", "вместо батарейки", "к лампочке голосом"], 1], ["4 батарейки по 1,5 В последовательно — это…", ["1,5 В", "4 В", "6 В", "9 В"], 2]]}, {"t": "Закон Ома и мощность", "f": ["Закон Ома — главный закон электричества: I = U / R. Ток = напряжение, делённое на сопротивление.", "Из закона Ома: U = I × R, а R = U / I. Запомни треугольник: сверху U, снизу I и R.", "Больше напряжение при том же сопротивлении — больше ток. Больше сопротивление — меньше ток.", "Мощность P = U × I. Измеряется в ваттах (Вт). Лампочка 60 Вт «ест» больше, чем светодиод 5 Вт.", "По закону Джоуля-Ленца ток греет проводник: P = I² × R. Так работают паяльник и чайник.", "Считалка: «Ватт — это Вольт на Ампер, помни это, юный краааасавчик»!"], "q": [["Закон Ома записывается как…", ["I = U / R", "I = R / U", "U = R / I", "R = I / U"], 0], ["Мощность вычисляется по формуле…", ["P = U × I", "P = U / I", "P = R × Q", "P = U + I"], 0], ["Если напряжение вырастет, а сопротивление останется тем же, ток…", ["уменьшится", "не изменится", "увеличится", "исчезнет"], 2], ["Мощность измеряется в…", ["ваттах", "амперах", "омах", "вольтах"], 0], ["Почему паяльник нагревается?", ["ток греет проводник (закон Джоуля-Ленца)", "от страха", "от магнита", "от света"], 0]]}, {"t": "Резисторы", "f": ["Резистор — деталь, которая ограничивает ток. Без него лампочка и светодиод сгорят.", "Резисторы размечают цветными полосками: каждая полоска — цифра.", "Чёрный — 0, коричневый — 1, красный — 2, оранжевый — 3, жёлтый — 4, зелёный — 5.", "Синий — 6, фиолетовый — 7, серый — 8, белый — 9. Третья полоска — множитель (сколько нулей).", "Последовательно (друг за другом): R = R1 + R2. Сопротивления складываются.", "Параллельно (рядом, между одними точками): сопротивление становится МЕНЬШЕ самого маленького."], "q": [["Зачем нужен резистор в цепи со светодиодом?", ["ограничить ток", "украсить плату", "усилить свет", "измерять ток"], 0], ["Красная полоска — это цифра…", ["1", "2", "7", "9"], 1], ["Как сложить сопротивления последовательно?", ["R1 + R2", "R1 × R2", "R1 / R2", "никак"], 0], ["1 килоом — это…", ["10 ом", "100 ом", "1000 ом", "1 000 000 ом"], 2], ["При параллельном соединении общее сопротивление…", ["растёт", "становится меньше самого маленького", "не меняется", "становится нулевым"], 1]]}, {"t": "Светодиоды", "f": ["Светодиод (LED) — лампочка из полупроводника. Светится, когда через него идёт ток.", "У LED есть полярность: анод (+, длинная ножка) и катод (−, короткая). Перепутаешь — не загорится.", "Светодиод нельзя включать без резистора — он сгорит от лишнего тока.", "Обычный LED светится при 2–3 В и токе около 10–20 мА.", "Резистор для LED считают по формуле: R = (U питания − U светодиода) / I.", "Пример: питание 9 В, LED 2 В, ток 0,02 А: R = (9 − 2) / 0,02 = 350 Ом."], "q": [["Длинная ножка светодиода — это…", ["катод (−)", "анод (+)", "антенна", "ручка"], 1], ["Что будет с LED без резистора?", ["будет светить ярче и радоваться", "сгорит", "станет лампочкой", "ничего"], 1], ["При каком напряжении светится обычный LED?", ["2–3 В", "220 В", "0,001 В", "100 В"], 0], ["Формула резистора для LED:", ["R = (U пит − U LED) / I", "R = U × I", "R = U + I", "R = I / U"], 0], ["Питание 6 В, LED 2 В, ток 0,02 А. Резистор =", ["100 Ом", "200 Ом", "400 Ом", "1000 Ом"], 1]]}, {"t": "Пайка и инструменты", "f": ["Паяльник соединяет детали расплавленным припоем — «электрическим клеем» из олова.", "Припой плавится примерно при 200 °C — жало паяльника всегда горячее!", "Канифоль — флюс: она очищает металл и помогает припою растекаться ровно.", "Порядок пайки: прогреть место пайки, поднести припой, убрать припой, убрать паяльник, не шевелить.", "Безопасность: паять только со взрослыми, не трогать жало, не нюхать дым, вентиляция обязательна.", "Полезные инструменты: кусачки, стриппер (снимает изоляцию), отвёртки, мультиметр."], "q": [["Чем паяльник соединяет детали?", ["припоем", "скотчем", "клеем ПВА", "нитками"], 0], ["Канифоль нужна, чтобы…", ["очистить металл и помочь припою растекаться", "пахнуть приятнее", "охлаждать", "красить"], 0], ["Припой плавится примерно при…", ["20 °C", "200 °C", "2000 °C", "0 °C"], 1], ["Что нельзя делать при пайке?", ["трогать жало", "включать паяльник", "держать паяльник за ручку", "использовать канифоль"], 0], ["Стриппер — это…", ["инструмент для снятия изоляции", "танец", "вид резистора", "мультфильм"], 0]]}, {"t": "Питание: батарейки и блоки", "f": ["Батарейка — химический источник: внутри химия «давит» на электроны.", "Аккумулятор можно заряжать снова и снова, обычную батарейку — нет.", "Блок питания берёт 220 В из розетки и превращает в безопасные 5–12 В.", "Батарейки последовательно: напряжения складываются. Параллельно: напряжение то же, дольше работает.", "Ёмкость измеряют в миллиампер-часах (мА·ч): чем больше, тем дольше проработает.", "Не бросай батарейки в огонь и не замыкай их «напрямую» — это опасно."], "q": [["Чем аккумулятор отличается от батарейки?", ["его можно заряжать", "он тяжелее", "он синий", "он louder"], 0], ["Что делает блок питания?", ["повышает 220 В до 1000 В", "превращает 220 В в безопасные 5–12 В", "пахнет", "охлаждает"], 1], ["Две батарейки по 1,5 В последовательно дают…", ["1,5 В", "3 В", "30 В", "0 В"], 1], ["Ёмкость измеряется в…", ["мА·ч", "килограммах", "амперах в секунду", "метрах"], 0], ["Что нельзя делать с батарейкой?", ["ставить её в игрушку", "замыкать накоротко и бросать в огонь", "покупать новую", "хранить в сухом месте"], 1]]}, {"t": "Конденсаторы", "f": ["Конденсатор — «ведро для электричества»: накапливает заряд и отдаёт его, когда нужно.", "Ёмкость измеряется в фарадах, обычно в микрофарадах (мкФ).", "Применение: сглаживать скачки питания, делать задержки, фильтровать шум.", "Полярные конденсаторы (электролитические) нельзя включать наоборот — они могут вздуться!", "После отключения питания конденсатор может остаться заряженным — не трогай выводы сразу.", "Большой конденсатор в блоке питания 220 В опасен — разряжать его нельзя пальцем!"], "q": [["Что делает конденсатор?", ["накапливает заряд", "усиливает ток", "пахнет", "светит"], 0], ["Ёмкость измеряется в…", ["фарадах", "омах", "ваттах", "ньютонах"], 0], ["Что нельзя делать с полярным конденсатором?", ["включать его наоборот", "использовать в схеме", "покупать", "читать маркировку"], 0], ["Конденсатор после отключения питания может быть…", ["разряжен всегда", "заряжен — осторожно!", "холодным", "мокрым"], 1], ["МкФ — это…", ["микрофарада", "милликилоом", "мегафарс", "маленький фонарик"], 0]]}, {"t": "Диоды и транзисторы", "f": ["Диод — «клапан»: пропускает ток только в одну сторону.", "Светодиод — тоже диод, только светится. Логично!", "Транзистор — усилитель и «электронный выключатель»: маленький ток управляет большим.", "У транзистора три вывода: база, коллектор, эмиттер.", "Полупроводники — материалы между проводником и изолятором. Их основа — кремний, как в песке.", "На диоде полоска обозначает катод (−)."], "q": [["Диод пропускает ток…", ["в обе стороны", "только в одну сторону", "никогда", "по кругу"], 1], ["Ско function tgl(i){me().p.l[i]=!me().p.l[i];save();draw()}
SCR.cheat=a=>{let t='<button class="btn gray" onclick="go2(\'home\')">← Назад</button><h1>🧾 Шпаргалка</h1>';CHEAT.forEach(c=>t+='<div class=card><b>'+esc(c[0])+'</b><p>'+esc(c[1])+'</p></div>');return t};
SCR.exp=a=>{let t='<button class="btn gray" onclick="go2(\'home\')">← Назад</button><h1>🔬 Опыты (со взрослыми!)</h1>';EXP.forEach((e,i)=>t+='<div class=card><b>'+(i+1)+'. '+esc(e[0])+'</b><p>'+esc(e[1])+'</p></div>');return t};
SCR.calc=a=>{let t='<button class="btn gray" onclick="go2(\'home\')">← Назад</button><h1>🎨 Считалка резисторов</h1><p class=mut>Выбери цвета четырёх полосок:</p>';
 const C=['Чёрный','Коричневый','Красный','Оранжевый','Жёлтый','Зелёный','Синий','Фиолетовый','Серый','Белый'];
 for(let k=0;k<4;k++)t+='<select id=rc'+k+' onchange="calcR()">'+C.map((c,j)=>'<option value='+j+'>'+(k===3&&j>0?'':'')+c+'</option>').join('')+'</select>';
 return t+'<div class=card><span class=big id=rres>—</span></div>'};
function calcR(){const v=[$('rc0').value,$('rc1').value,$('rc2').value,$('rc3').value];const r=(+v[0]*10+ +v[1])*Math.pow(10,+v[2]);const d=[20,1,2,0.5,0,0.5,0.25,0.1,0.05,10][+v[3]];
 const s=r<1e3?r:(r<1e6?(r/1e3)+' к':(r/1e6)+' М');$('rres').textContent=s+' Ом'}
SCR.led=a=>'<button class="btn gray" onclick="go2(\'home\')">← Назад</button><h1>💡 LED-считалка</h1><div class=card><p>Напряжение питания (В): <input id=lv value="9" oninput="ledR()"></p><p>Напряжение LED (В): <input id=lf value="2" oninput="ledR()"></p><p>Ток (мА): <input id=li value="20" oninput="ledR()"></p><span class=big id=lres></span></div>';
function ledR(){const vs=+$('lv').value,vf=+$('lf').value,i=+$('li').value/1000;const r=i>0?(vs-vf)/i:0;$('lres').textContent=r>0?'Резистор: '+Math.round(r)+' Ом':'Проверь числа'}
SCR.panel=(a,u)=>{if(!u.a)return '<div class=card>Это раздел СУПЕР ПАПОЧКИ.</div>';
 let t='<button class="btn gray" onclick="go2(\'home\')">← Назад</button><h1>🧑‍🏫 Панель СУПЕР ПАПОЧКИ</h1><div class=card><b>Код приглашения:</b><div class=code style="font-size:24px">'+u.inv+'</div><p class=mut>Скажите его ученикам — они введут его при регистрации.</p></div>';
 const studs=Object.values(U).filter(x=>!x.a);
 t+='<div class=card><h2>Внести отчёт</h2><textarea id=rpt placeholder="Вставь отчёт-код (можно несколько, по одному в строке)"></textarea><button class=btn onclick="applyRep()">Внести</button></div>';
 t+='<h2>Ученики ('+studs.length+')</h2><table><tr><th>Имя</th><th>Ранг</th><th>Недель</th><th>Тест</th><th>Законы</th><th>XP</th></tr>';
 if(!studs.length)t+='<tr><td colspan=6>Пока никого — дайте ученикам код приглашения.</td></tr>';
 studs.forEach(s=>t+='<tr><td>'+esc(s.n)+'</td><td>'+rank(xp(s))+'</td><td>'+s.p.w.filter(Boolean).length+'/12</td><td>'+(s.p.bb||0)+'/50</td><td>'+s.p.l.filter(Boolean).length+'/'+LAWS.length+'</td><td>'+xp(s)+'</td></tr>');
 return t+'</table>'};
function applyRep(){const lines=$('rpt').value.split('\n');let ok=0,bad=0;
 for(const line of lines){if(!line.trim())continue;const r=prcode(line);
 if(!r){bad++;continue}
 let s=U[r.n]&&!U[r.n].a?U[r.n]:null;
 if(!s){s={n:r.n,pin:'0000',a:false,inv:null,p:{w:WEEKS.map(()=>false),l:LAWS.map(()=>false),bb:0}};U[r.n]=s}
 s.p.w=WEEKS.map((_,i)=>i<r.W);s.p.bb=Math.max(s.p.bb||0,r.B);s.p.l=LAWS.map((_,i)=>i<r.L);ok++}
 save();alert('Внесено отчётов: '+ok+(bad?', не распознано: '+bad:''));draw()}
SCR.profile=(a,u)=>{const x=xp(u);return '<button class="btn gray" onclick="go2(\'home\')">← Назад</button><h1>👤 Профиль</h1><div class=card><span class=big>'+esc(u.n)+'</span><p>'+(u.a?'👑 СУПЕР ПАПОЧКА':rank(x))+'</p><p class=mut>XP: '+x+'</p><p class=mut>Недель зачтено: '+u.p.w.filter(Boolean).length+'/12</p><p class=mut>Лучший большой тест: '+(u.p.bb||0)+'/50</p><p class=mut>Законы: '+u.p.l.filter(Boolean).length+'/'+LAWS.length+'</p></div>'};
draw();</script></body></html>
